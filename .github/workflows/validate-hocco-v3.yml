name: Validate HOCCO Hype V3

on:
  push:
    branches:
      - redesign-ofertas-v3-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541d292f52c1d4127a5e0c1f78c5a5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: impulsionadores/package-lock.json
      - name: Install
        working-directory: impulsionadores
        run: npm ci
      - name: Build
        working-directory: impulsionadores
        run: npm run build
