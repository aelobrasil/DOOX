name: HOCCO HC150 e missão YouTube

on:
  push:
    paths:
      - '.github/workflows/hocco-hc150-youtube-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Aplicar ajustes HOCCO
        shell: python
        run: |
          from pathlib import Path

          member = Path('impulsionadores/app/app/page.js')
          s = member.read_text(encoding='utf-8')

          def one(old, new, label):
            global s
            if old not in s:
              raise SystemExit(f'Fragmento não encontrado: {label}')
            s = s.replace(old, new, 1)

          one(
            "  HeartHandshake, Home, LogOut, MessageCircle, QrCode, Sparkles, Target, Trophy,\n  User, WalletCards, X, Zap,\n",
            "  HeartHandshake, Home, LogOut, MessageCircle, QrCode, Sparkles, Target, Trophy,\n  User, WalletCards, X, Youtube, Zap,\n",
            'import Youtube'
          )
          one(
            "  const [daily, setDaily] = useState(null);\n  const [tab, setTab] = useState('inicio');",
            "  const [daily, setDaily] = useState(null);\n  const [youtubeVisited, setYoutubeVisited] = useState(false);\n  const [tab, setTab] = useState('inicio');",
            'estado YouTube'
          )
          one(
            "  async function loadDaily(currentUser = user) {\n    const { data } = await supabase.from('hc_diario').select('*').eq('user_id', currentUser.id).eq('activity_date', todayBR()).maybeSingle();\n    setDaily(data || { hc_earned: 0, missions_completed: 1, boards_hyped: 0 });\n  }",
            "  async function loadDaily(currentUser = user) {\n    const date = todayBR();\n    const [{ data: hcData }, { data: youtubeMission }] = await Promise.all([\n      supabase.from('hc_diario').select('*').eq('user_id', currentUser.id).eq('activity_date', date).maybeSingle(),\n      supabase.from('impulsionadores_missoes_diarias').select('mission_key').eq('user_id', currentUser.id).eq('mission_date', date).eq('mission_key', 'youtube_channel_visit').maybeSingle(),\n    ]);\n    setDaily(hcData || { hc_earned: 0, missions_completed: 1, boards_hyped: 0 });\n    setYoutubeVisited(Boolean(youtubeMission));\n  }",
            'loadDaily'
          )
          one(
            "  }\n  async function openCompany(slot) {",
            "  }\n  async function visitYoutube() {\n    if (!user) return;\n    window.open('https://www.youtube.com/@hoccpov', '_blank', 'noopener,noreferrer');\n    if (youtubeVisited) return;\n    const { error } = await supabase.from('impulsionadores_missoes_diarias').insert({\n      user_id: user.id, mission_date: todayBR(), mission_key: 'youtube_channel_visit', metadata: { channel: '@hoccpov' },\n    });\n    if (error && !String(error.message || '').toLowerCase().includes('duplicate')) return showToast('O canal foi aberto, mas a missão não pôde ser registrada agora.');\n    setYoutubeVisited(true);\n    showToast('Missão concluída: visita ao canal oficial @hoccpov. +5 XP.');\n    await Promise.all([loadDaily(), loadProfile()]);\n  }\n  async function openCompany(slot) {",
            'visitYoutube'
          )
          one(
            "  const boardsHyped = daily?.boards_hyped || 0;\n  const totalImpulsed =",
            "  const boardsHyped = daily?.boards_hyped || 0;\n  const dailyMissions = 1 + Math.min(3, boardsHyped) + (youtubeVisited ? 1 : 0);\n  const missionProgress = Math.min(100, dailyMissions * 20);\n  const totalImpulsed =",
            'missionProgress'
          )

          s = s.replace('MISSÕES AUTOMÁTICAS', 'MISSÕES DIÁRIAS', 1)
          s = s.replace('{Math.min(100,25+boardsHyped*25)}%', '{missionProgress}%', 1)
          s = s.replace('style={{width:`${Math.min(100,25+boardsHyped*25)}%`}}', 'style={{width:`${missionProgress}%`}}', 1)
          one(
            '<Mission done title="Entrou no app" reward="+5 XP"/>',
            '<Mission done title="Entrou no app" reward="+5 XP"/><button type="button" className={youtubeVisited?\'microMission done\':\'microMission\'} style={{background:youtubeVisited?\'#f4f9ff\':\'#fff\',width:\'100%\',textAlign:\'left\'}} onClick={visitYoutube}><Youtube style={{color:\'#ff0000\'}}/><span>Visitar @hoccpov</span><b>{youtubeVisited?\'+5 XP · FEITO\':\'+5 XP\'}</b></button>',
            'missão YouTube home'
          )
          s = s.replace('As missões são concluídas automaticamente pelas ações reais dentro do app.', 'Missões extras podem render XP, mas o teto continua sendo 2 HC por dia.', 1)
          s = s.replace('Mesmo completando tudo, o máximo é 2 HC por dia.', 'Mesmo completando todas as missões, o máximo absoluto é 2 HC por dia.', 1)
          one(
            '<MissionRow done title="Presença HOCCO" text="Entrar no app hoje mantém sua ofensiva." reward="+5 XP"/>',
            '<MissionRow done title="Presença HOCCO" text="Entrar no app hoje mantém sua ofensiva." reward="+5 XP"/><button type="button" className={youtubeVisited?\'missionRow done\':\'missionRow\'} style={{width:\'100%\',textAlign:\'left\',background:youtubeVisited?\'#fbfdff\':\'#fff\'}} onClick={visitYoutube}><span style={{color:\'#ff0000\'}}><Youtube/></span><div><b>Canal oficial HOCCO</b><small>Visite @hoccpov no YouTube uma vez por dia.</small></div><em>{youtubeVisited?\'+5 XP · FEITO\':\'+5 XP\'}</em></button>',
            'missão YouTube lista'
          )
          s = s.replace('100 HC desbloqueiam experiências.', '150 HC desbloqueiam experiências.', 1)
          s = s.replace('{hc}/100', '{hc}/150', 1)
          s = s.replace('A partir de 100 HC você pode se candidatar a experiências HOCCO e de empresas parceiras.', 'A partir de 150 HC você pode se candidatar a experiências HOCCO e de empresas parceiras.', 1)
          s = s.replace('{hc<100&&', '{hc<150&&', 1)
          s = s.replace('Faltam {100-hc} HC', 'Faltam {150-hc} HC', 1)
          member.write_text(s, encoding='utf-8')

          control = Path('impulsionadores/app/controle/page.js')
          c = control.read_text(encoding='utf-8')
          old = "hc_min:Math.max(100,Number(form.get('hc_min')||100))"
          if old not in c: raise SystemExit('HC mínimo não encontrado no Control')
          c = c.replace(old, "hc_min:Math.max(150,Number(form.get('hc_min')||150))", 1)
          old = '<label>HC mínimo<input name="hc_min" type="number" min="100" defaultValue="100" required/></label>'
          if old not in c: raise SystemExit('Input HC mínimo não encontrado no Control')
          c = c.replace(old, '<label>HC mínimo<input name="hc_min" type="number" min="150" defaultValue="150" required/></label>', 1)
          control.write_text(c, encoding='utf-8')

          rules = Path('impulsionadores/app/regras-hc/page.js')
          r = rules.read_text(encoding='utf-8')
          r = r.replace('<h2>100 HC</h2><p>A partir de 100 HC', '<h2>150 HC</h2><p>A partir de 150 HC', 1)
          rules.write_text(r, encoding='utf-8')

          Path('.github/workflows/hocco-hc150-youtube-once.yml').unlink()

      - name: Validar build
        working-directory: impulsionadores
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publicar ajustes no branch principal
        run: |
          git config user.name "HOCCO Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add impulsionadores/app/app/page.js impulsionadores/app/controle/page.js impulsionadores/app/regras-hc/page.js .github/workflows/hocco-hc150-youtube-once.yml
          git commit -m "impulsionadores: limita HC, eleva experiências e adiciona missão YouTube"
          git push origin HEAD:main
