name: HOCCO HC150 e missão YouTube

on:
  push:
    paths:
      - '.github/workflows/hocco-hc150-youtube-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Aplicar ajustes HOCCO
        shell: python
        run: |
          from pathlib import Path

          member = Path('impulsionadores/app/app/page.js')
          s = member.read_text(encoding='utf-8')
          replacements = [
            (
              "  HeartHandshake, Home, LogOut, MessageCircle, QrCode, Sparkles, Target, Trophy,\n  User, WalletCards, X, Zap,\n",
              "  HeartHandshake, Home, LogOut, MessageCircle, QrCode, Sparkles, Target, Trophy,\n  User, WalletCards, X, Youtube, Zap,\n",
            ),
            (
              "  const [daily, setDaily] = useState(null);\n  const [tab, setTab] = useState('inicio');",
              "  const [daily, setDaily] = useState(null);\n  const [youtubeVisited, setYoutubeVisited] = useState(false);\n  const [tab, setTab] = useState('inicio');",
            ),
            (
              "  async function loadDaily(currentUser = user) {\n    const { data } = await supabase.from('hc_diario').select('*').eq('user_id', currentUser.id).eq('activity_date', todayBR()).maybeSingle();\n    setDaily(data || { hc_earned: 0, missions_completed: 1, boards_hyped: 0 });\n  }",
              "  async function loadDaily(currentUser = user) {\n    const date = todayBR();\n    const [{ data: hcData }, { data: youtubeMission }] = await Promise.all([\n      supabase.from('hc_diario').select('*').eq('user_id', currentUser.id).eq('activity_date', date).maybeSingle(),\n      supabase.from('impulsionadores_missoes_diarias').select('mission_key').eq('user_id', currentUser.id).eq('mission_date', date).eq('mission_key', 'youtube_channel_visit').maybeSingle(),\n    ]);\n    setDaily(hcData || { hc_earned: 0, missions_completed: 1, boards_hyped: 0 });\n    setYoutubeVisited(Boolean(youtubeMission));\n  }",
            ),
            (
              "  }\n  async function openCompany(slot) {",
              "  }\n  async function visitYoutube() {\n    if (!user) return;\n    const channelUrl = 'https://www.youtube.com/@hoccpov';\n    window.open(channelUrl, '_blank', 'noopener,noreferrer');\n    if (youtubeVisited) return;\n    const { error } = await supabase.from('impulsionadores_missoes_diarias').insert({\n      user_id: user.id, mission_date: todayBR(), mission_key: 'youtube_channel_visit', metadata: { channel: '@hoccpov' },\n    });\n    if (error && !String(error.message || '').toLowerCase().includes('duplicate')) {\n      return showToast('O canal foi aberto, mas a missão não pôde ser registrada agora.');\n    }\n    setYoutubeVisited(true);\n    showToast('Missão concluída: visita ao canal oficial @hoccpov. +5 XP.');\n    await Promise.all([loadDaily(), loadProfile()]);\n  }\n  async function openCompany(slot) {",
            ),
            (
              "  const boardsHyped = daily?.boards_hyped || 0;\n  const totalImpulsed =",
              "  const boardsHyped = daily?.boards_hyped || 0;\n  const dailyMissions = 1 + Math.min(3, boardsHyped) + (youtubeVisited ? 1 : 0);\n  const missionProgress = Math.min(100, dailyMissions * 20);\n  const totalImpulsed =",
            ),
            (
              "<section className=\"missionPulse\"><div className=\"sectionHead\"><div><small>MISSÕES AUTOMÁTICAS</small><h2>Seu dia é validado pelo sistema.</h2></div><strong>{Math.min(100,25+boardsHyped*25)}%</strong></div><div className=\"progress\"><div style={{width:`${Math.min(100,25+boardsHyped*25)}%`}}/></div><div className=\"microMissions\"><Mission done title=\"Entrou no app\" reward=\"+5 XP\"/><Mission done={boardsHyped>=1} title=\"Primeiro quadro\" reward=\"+1 HC · +25 XP\"/><Mission done={boardsHyped>=2} title=\"Segundo quadro\" reward=\"+1 HC · +25 XP\"/><Mission done={boardsHyped>=3} title=\"Dia completo\" reward=\"+25 XP\"/></div></section>",
              "<section className=\"missionPulse\"><div className=\"sectionHead\"><div><small>MISSÕES DIÁRIAS</small><h2>Seu dia é validado pelo sistema.</h2></div><strong>{missionProgress}%</strong></div><div className=\"progress\"><div style={{width:`${missionProgress}%`}}/></div><div className=\"microMissions\"><Mission done title=\"Entrou no app\" reward=\"+5 XP\"/><button type=\"button\" className={youtubeVisited?'microMission done':'microMission'} style={{background:youtubeVisited?'#f4f9ff':'#fff',width:'100%',textAlign:'left'}} onClick={visitYoutube}><Youtube style={{color:'#ff0000'}}/><span>Visitar @hoccpov</span><b>{youtubeVisited?'+5 XP · FEITO':'+5 XP'}</b></button><Mission done={boardsHyped>=1} title=\"Primeiro quadro\" reward=\"+1 HC · +25 XP\"/><Mission done={boardsHyped>=2} title=\"Segundo quadro\" reward=\"+1 HC · +25 XP\"/><Mission done={boardsHyped>=3} title=\"Dia completo\" reward=\"+25 XP\"/></div></section>",
            ),
            (
              "{tab==='missoes' && <><Title eyebrow=\"OFENSIVA HOCCO\" title={`${profile.ofensiva_dias} dias de constância`} text=\"Entrar em um novo dia mantém sua ofensiva. As missões são concluídas automaticamente pelas ações reais dentro do app.\"/><div className=\"hcCap\"><Sparkles/><div><small>LIMITE DIÁRIO</small><h2>{dailyHC}/2 HC conquistados hoje</h2><p>Mesmo completando tudo, o máximo é 2 HC por dia.</p></div></div><div className=\"missionList\"><MissionRow done title=\"Presença HOCCO\" text=\"Entrar no app hoje mantém sua ofensiva.\" reward=\"+5 XP\"/><MissionRow done={boardsHyped>=1} title=\"Primeiro Hype\" text=\"Escolher uma empresa em um quadro válido.\" reward=\"+1 HC · +25 XP\"/><MissionRow done={boardsHyped>=2} title=\"Dois momentos\" text=\"Participar de dois quadros diferentes.\" reward=\"+1 HC · +25 XP\"/><MissionRow done={boardsHyped>=3} title=\"Dia completo\" text=\"Participar de Almoço, Tarde e Noite.\" reward=\"+25 XP\"/></div><div className=\"unlockCard\"><Award/><div><small>PORTA DE ENTRADA</small><h2>100 HC desbloqueiam experiências.</h2><p>HC torna você elegível; não compra automaticamente uma vaga.</p></div><strong>{hc}/100</strong></div></>}",
              "{tab==='missoes' && <><Title eyebrow=\"OFENSIVA HOCCO\" title={`${profile.ofensiva_dias} dias de constância`} text=\"Entrar em um novo dia mantém sua ofensiva. Missões extras podem render XP, mas o teto continua sendo 2 HC por dia.\"/><div className=\"hcCap\"><Sparkles/><div><small>LIMITE DIÁRIO</small><h2>{dailyHC}/2 HC conquistados hoje</h2><p>Mesmo completando todas as missões, o máximo absoluto é 2 HC por dia.</p></div></div><div className=\"missionList\"><MissionRow done title=\"Presença HOCCO\" text=\"Entrar no app hoje mantém sua ofensiva.\" reward=\"+5 XP\"/><button type=\"button\" className={youtubeVisited?'missionRow done':'missionRow'} style={{width:'100%',textAlign:'left',background:youtubeVisited?'#fbfdff':'#fff'}} onClick={visitYoutube}><span style={{color:'#ff0000'}}><Youtube/></span><div><b>Canal oficial HOCCO</b><small>Visite @hoccpov no YouTube uma vez por dia.</small></div><em>{youtubeVisited?'+5 XP · FEITO':'+5 XP'}</em></button><MissionRow done={boardsHyped>=1} title=\"Primeiro Hype\" text=\"Escolher uma empresa em um quadro válido.\" reward=\"+1 HC · +25 XP\"/><MissionRow done={boardsHyped>=2} title=\"Dois momentos\" text=\"Participar de dois quadros diferentes.\" reward=\"+1 HC · +25 XP\"/><MissionRow done={boardsHyped>=3} title=\"Dia completo\" text=\"Participar de Almoço, Tarde e Noite.\" reward=\"+25 XP\"/></div><div className=\"unlockCard\"><Award/><div><small>PORTA DE ENTRADA</small><h2>150 HC desbloqueiam experiências.</h2><p>HC torna você elegível; não compra automaticamente uma vaga.</p></div><strong>{hc}/150</strong></div></>}",
            ),
            (
              "{tab==='experiencias' && <><Title eyebrow=\"EXPERIÊNCIAS HOCCO\" title=\"Acesso que não está à venda.\" text=\"A partir de 100 HC você pode se candidatar a experiências HOCCO e de empresas parceiras.\"/>{hc<100&&<div className=\"lockedExperience\"><Award/><div><b>Faltam {100-hc} HC</b><span>O limite continua sendo 2 HC por dia.</span></div></div>}",
              "{tab==='experiencias' && <><Title eyebrow=\"EXPERIÊNCIAS HOCCO\" title=\"Acesso que não está à venda.\" text=\"A partir de 150 HC você pode se candidatar a experiências HOCCO e de empresas parceiras.\"/>{hc<150&&<div className=\"lockedExperience\"><Award/><div><b>Faltam {150-hc} HC</b><span>O limite continua sendo 2 HC por dia.</span></div></div>}",
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Fragmento não encontrado em member page: {old[:100]}')
            s = s.replace(old, new, 1)
          member.write_text(s, encoding='utf-8')

          control = Path('impulsionadores/app/controle/page.js')
          s = control.read_text(encoding='utf-8')
          pairs = [
            ("hc_min:Math.max(100,Number(form.get('hc_min')||100))", "hc_min:Math.max(150,Number(form.get('hc_min')||150))"),
            ('<label>HC mínimo<input name="hc_min" type="number" min="100" defaultValue="100" required/></label>', '<label>HC mínimo<input name="hc_min" type="number" min="150" defaultValue="150" required/></label>'),
          ]
          for old, new in pairs:
            if old not in s:
              raise SystemExit(f'Fragmento não encontrado em Control: {old}')
            s = s.replace(old, new, 1)
          control.write_text(s, encoding='utf-8')

          rules = Path('impulsionadores/app/regras-hc/page.js')
          s = rules.read_text(encoding='utf-8')
          if '<h2>100 HC</h2><p>A partir de 100 HC' not in s:
            raise SystemExit('Regra de 100 HC não encontrada')
          s = s.replace('<h2>100 HC</h2><p>A partir de 100 HC', '<h2>150 HC</h2><p>A partir de 150 HC', 1)
          rules.write_text(s, encoding='utf-8')

          Path('.github/workflows/hocco-hc150-youtube-once.yml').unlink()

      - name: Validar build
        working-directory: impulsionadores
        run: |
          npm ci
          npm run build

      - name: Publicar ajustes no branch principal
        run: |
          git config user.name "HOCCO Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add impulsionadores/app/app/page.js impulsionadores/app/controle/page.js impulsionadores/app/regras-hc/page.js .github/workflows/hocco-hc150-youtube-once.yml
          git commit -m "impulsionadores: limita HC, eleva experiências e adiciona missão YouTube"
          git push origin HEAD:main
