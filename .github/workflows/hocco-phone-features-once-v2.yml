name: HOCCO recursos telefone v2
on:
  push:
    paths:
      - '.github/workflows/hocco-phone-features-once-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - name: Aplicar recursos
        shell: python
        run: |
          from pathlib import Path
          p=Path('impulsionadores/app/app/page.js'); s=p.read_text(encoding='utf-8')
          def rep(old,new):
            global s
            if old not in s: raise SystemExit('Âncora ausente: '+old[:120])
            s=s.replace(old,new,1)
          rep("Award, Bolt, Building2, Camera, CheckCircle2, ChevronRight, Download, Flame,\n  HeartHandshake, Home, LogOut, MessageCircle, QrCode, Sparkles, Target, Trophy,\n  User, WalletCards, X, Youtube, Zap,","Award, Bolt, Building2, Camera, CheckCircle2, ChevronRight, Download, Flame, Gamepad2,\n  HeartHandshake, Home, LogOut, MessageCircle, QrCode, Share2, Sparkles, Target, Trophy,\n  User, WalletCards, X, Youtube, Zap,")
          rep("  const [youtubeVisited, setYoutubeVisited] = useState(false);\n  const [tab, setTab] = useState('inicio');","  const [youtubeVisited, setYoutubeVisited] = useState(false);\n  const [pulsoDone, setPulsoDone] = useState(false);\n  const [gameOpen, setGameOpen] = useState(false);\n  const [tab, setTab] = useState('inicio');")
          rep("  async function loadDaily(currentUser = user) {\n    const date = todayBR();\n    const [{ data: hcData }, { data: youtubeMission }] = await Promise.all([\n      supabase.from('hc_diario').select('*').eq('user_id', currentUser.id).eq('activity_date', date).maybeSingle(),\n      supabase.from('impulsionadores_missoes_diarias').select('mission_key').eq('user_id', currentUser.id).eq('mission_date', date).eq('mission_key', 'youtube_channel_visit').maybeSingle(),\n    ]);\n    setDaily(hcData || { hc_earned: 0, missions_completed: 1, boards_hyped: 0 });\n    setYoutubeVisited(Boolean(youtubeMission));\n  }","  async function loadDaily(currentUser = user) {\n    const date = todayBR();\n    const [{ data: hcData }, { data: youtubeMission }, { data: pulsoMission }] = await Promise.all([\n      supabase.from('hc_diario').select('*').eq('user_id', currentUser.id).eq('activity_date', date).maybeSingle(),\n      supabase.from('impulsionadores_missoes_diarias').select('mission_key').eq('user_id', currentUser.id).eq('mission_date', date).eq('mission_key', 'youtube_channel_visit').maybeSingle(),\n      supabase.from('impulsionadores_missoes_diarias').select('mission_key').eq('user_id', currentUser.id).eq('mission_date', date).eq('mission_key', 'pulso_daily').maybeSingle(),\n    ]);\n    setDaily(hcData || { hc_earned: 0, missions_completed: 1, boards_hyped: 0 });\n    setYoutubeVisited(Boolean(youtubeMission));\n    setPulsoDone(Boolean(pulsoMission));\n  }")
          rep("  useEffect(() => { if (user) loadHype(board, user); }, [board, user?.id]);","  useEffect(() => { if (user) loadHype(board, user); }, [board, user?.id]);\n\n  useEffect(() => {\n    if (!daily || typeof navigator === 'undefined') return;\n    const pending = (Number(daily.hc_earned || 0) < 2 ? 1 : 0) + (youtubeVisited ? 0 : 1) + (pulsoDone ? 0 : 1);\n    if (pending > 0 && 'setAppBadge' in navigator) navigator.setAppBadge(pending).catch(() => {});\n    else if (pending === 0 && 'clearAppBadge' in navigator) navigator.clearAppBadge().catch(() => {});\n  }, [daily, youtubeVisited, pulsoDone]);")
          rep("  async function visitYoutube() {","  function haptic(pattern = 18) { if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(pattern); }\n  async function shareHocco() {\n    const shareData = { title: 'HOCCO Impulsionadores', text: `Estou com ${profile?.ofensiva_dias || 0} dias de ofensiva na HOCCO.`, url: 'https://hocco-impulsionadores.vercel.app' };\n    try { if (navigator.share) await navigator.share(shareData); else { await navigator.clipboard?.writeText(shareData.url); showToast('Link da HOCCO copiado.'); } haptic(15); await logEvent('share_app','app','hocco'); } catch (error) { if (error?.name !== 'AbortError') showToast('Não foi possível compartilhar agora.'); }\n  }\n  async function completePulso(result) {\n    haptic([20,35,20]); await logEvent('pulso_game','minigame','pulso',result);\n    if (!pulsoDone) { const { error } = await supabase.from('impulsionadores_missoes_diarias').insert({ user_id:user.id, mission_date:todayBR(), mission_key:'pulso_daily', metadata:result }); if (!error || String(error.message||'').toLowerCase().includes('duplicate')) { setPulsoDone(true); showToast(`Pulso concluído: ${result.score} pontos. +5 XP pela primeira partida do dia.`); await Promise.all([loadDaily(),loadProfile()]); return; } }\n    showToast(`Pulso concluído: ${result.score} pontos.`);\n  }\n  async function visitYoutube() {")
          rep("    setYoutubeVisited(true);\n    showToast('Missão concluída: visita ao canal oficial @hoccpov. +5 XP.');","    setYoutubeVisited(true);\n    haptic(18);\n    showToast('Missão concluída: visita ao canal oficial @hoccpov. +5 XP.');")
          rep("    await logEvent('hype_valid', 'empresa', slot.empresa_id, { quadro: board });\n    showToast('Hype válido registrado. Seu progresso foi atualizado.');","    await logEvent('hype_valid', 'empresa', slot.empresa_id, { quadro: board });\n    haptic([20,30,20]);\n    showToast('Hype válido registrado. Seu progresso foi atualizado.');")
          rep("  const dailyMissions = 1 + Math.min(3, boardsHyped) + (youtubeVisited ? 1 : 0);\n  const missionProgress = Math.min(100, dailyMissions * 20);","  const dailyMissions = 1 + Math.min(3, boardsHyped) + (youtubeVisited ? 1 : 0) + (pulsoDone ? 1 : 0);\n  const missionProgress = Math.min(100, Math.round((dailyMissions / 6) * 100));")
          rep("{youtubeVisited?'+5 XP · FEITO':'+5 XP'}</b></button><Mission done={boardsHyped>=1}","{youtubeVisited?'+5 XP · FEITO':'+5 XP'}</b></button><button type=\"button\" className={pulsoDone?'microMission done':'microMission'} onClick={()=>setGameOpen(true)}><Gamepad2/><span>Pulso HOCCO</span><b>{pulsoDone?'JOGAR · XP FEITO':'+5 XP'}</b></button><Mission done={boardsHyped>=1}")
          rep("        {overallWinner&&<WinnerCard result={overallWinner} results={results}/>} ","        <div className=\"phoneFeatureRow\"><button className=\"pulsoCTA\" onClick={()=>setGameOpen(true)}><Gamepad2/><div><b>Pulso HOCCO</b><span>30 segundos · recorde pessoal · sem gastar HC</span></div><ChevronRight/></button><button className=\"shareCTA\" onClick={shareHocco}><Share2/><span>Compartilhar</span></button></div>\n        {overallWinner&&<WinnerCard result={overallWinner} results={results}/>} ")
          rep("{youtubeVisited?'+5 XP · FEITO':'+5 XP'}</em></button><MissionRow done={boardsHyped>=1}","{youtubeVisited?'+5 XP · FEITO':'+5 XP'}</em></button><button type=\"button\" className={pulsoDone?'missionRow done':'missionRow'} onClick={()=>setGameOpen(true)}><span><Gamepad2/></span><div><b>Pulso HOCCO</b><small>Jogue uma partida de 30 segundos. A primeira do dia rende XP.</small></div><em>{pulsoDone?'XP DO DIA FEITO':'+5 XP'}</em></button><MissionRow done={boardsHyped>=1}")
          rep("<div className=\"legalLinks\"><a href=\"/termos\">Termos</a><a href=\"/privacidade\">Privacidade</a></div><button className=\"outline\" onClick={install}","<div className=\"legalLinks\"><a href=\"/termos\">Termos</a><a href=\"/privacidade\">Privacidade</a></div><button className=\"outline\" onClick={shareHocco}><Share2/> COMPARTILHAR HOCCO</button><button className=\"outline\" onClick={install}")
          rep("    {toast&&<div className=\"toast\">{toast}</div>}","    {gameOpen&&<PulsoGame doneToday={pulsoDone} onFinish={completePulso} onClose={()=>setGameOpen(false)}/>}\n    {toast&&<div className=\"toast\">{toast}</div>}")
          rep("function CompanyModal({slot,onClose,onBenefit,onWhatsapp})","function PulsoGame({doneToday,onFinish,onClose}){const [running,setRunning]=useState(false),[seconds,setSeconds]=useState(30),[hits,setHits]=useState(0),[target,setTarget]=useState({x:50,y:50}),[result,setResult]=useState(null),[best,setBest]=useState(0);const hitsRef=useRef(0),missesRef=useRef(0);const move=()=>setTarget({x:10+Math.random()*80,y:16+Math.random()*70});useEffect(()=>{try{setBest(Number(localStorage.getItem('hocco_pulso_best')||0))}catch{}},[]);useEffect(()=>{if(!running)return;if(seconds<=0){const total=hitsRef.current+missesRef.current,final={score:hitsRef.current*10,hits:hitsRef.current,misses:missesRef.current,accuracy:total?Math.round(hitsRef.current/total*100):0,duration:30};setRunning(false);setResult(final);try{const n=Math.max(best,final.score);setBest(n);localStorage.setItem('hocco_pulso_best',String(n))}catch{};onFinish(final);return}const id=setTimeout(()=>setSeconds(v=>v-1),1000);return()=>clearTimeout(id)},[running,seconds]);useEffect(()=>{if(!running)return;const id=setTimeout(()=>{missesRef.current+=1;move()},Math.max(380,850-hits*14));return()=>clearTimeout(id)},[running,target,hits]);const start=()=>{hitsRef.current=0;missesRef.current=0;setHits(0);setSeconds(30);setResult(null);move();setRunning(true)},hit=e=>{e.stopPropagation();if(!running)return;hitsRef.current+=1;setHits(hitsRef.current);navigator.vibrate?.(12);move()},miss=()=>{if(!running)return;missesRef.current+=1;navigator.vibrate?.(5);move()};return <div className=\"gameBackdrop\"><section className=\"pulsoGame\"><button className=\"modalClose\" onClick={onClose}><X/></button><div className=\"gameTitle\"><Gamepad2/><div><small>MINIGAME HOCCO</small><h2>Pulso HOCCO</h2><p>Toque no pulso antes que ele mude de posição. Quanto mais acertos, mais rápido fica.</p></div></div><div className=\"gameHud\"><span><small>TEMPO</small><b>{seconds}s</b></span><span><small>ACERTOS</small><b>{hits}</b></span><span><small>RECORDE</small><b>{best}</b></span></div><div className=\"gameStage\" onClick={miss}>{running?<button className=\"pulseTarget\" aria-label=\"Pulso HOCCO\" onClick={hit} style={{left:`${target.x}%`,top:`${target.y}%`,width:`${Math.max(44,76-hits)}px`,height:`${Math.max(44,76-hits)}px`}}><Bolt/></button>:<div className=\"gameCenter\">{result?<><strong>{result.score}</strong><b>pontos</b><span>{result.hits} acertos · {result.accuracy}% precisão</span></>:<><Gamepad2/><b>30 segundos</b><span>A primeira partida do dia rende +5 XP. Nunca rende HC.</span></>}</div>}</div><div className=\"gameFooter\"><small>{doneToday?'XP diário já concluído. Continue jogando pelo recorde.':'Primeira partida do dia: +5 XP.'}</small><button className=\"primary\" disabled={running} onClick={start}>{result?'JOGAR NOVAMENTE':'COMEÇAR'}</button></div></section></div>}\nfunction CompanyModal({slot,onClose,onBenefit,onWhatsapp})")
          p.write_text(s,encoding='utf-8')
          css=Path('impulsionadores/app/living.css'); c=css.read_text(encoding='utf-8')
          if '/* HOCCO_PHONE_FEATURES */' not in c: c += '\n/* HOCCO_PHONE_FEATURES */\n.phoneFeatureRow{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.pulsoCTA,.shareCTA{border:0;border-radius:18px;display:flex;align-items:center;gap:12px}.pulsoCTA{padding:16px;background:#071f49;color:#fff;text-align:left}.pulsoCTA>svg:first-child{width:25px}.pulsoCTA div{flex:1}.pulsoCTA b,.pulsoCTA span{display:block}.pulsoCTA span{font-size:10px;color:#b9cae2;margin-top:3px}.pulsoCTA>svg:last-child{width:17px}.shareCTA{padding:0 18px;background:#edf5ff;color:#075eea;font-weight:900}.shareCTA svg{width:19px}.gameBackdrop{position:fixed;inset:0;background:#041126e8;z-index:80;display:grid;place-items:center;padding:18px}.pulsoGame{position:relative;width:min(620px,100%);background:#fff;border-radius:28px;padding:22px}.gameTitle{display:flex;gap:13px;align-items:flex-start;padding-right:42px}.gameTitle>svg{color:#075eea;width:30px;height:30px}.gameTitle small{font-size:9px;font-weight:900;color:#6681a7}.gameTitle h2{margin:3px 0;font-size:27px}.gameTitle p{margin:0;color:#718197;font-size:11px}.gameHud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.gameHud span{background:#f4f8fd;border-radius:14px;padding:10px;text-align:center}.gameHud small,.gameHud b{display:block}.gameHud small{font-size:8px;color:#73869f}.gameHud b{font-size:20px;color:#075eea}.gameStage{height:360px;border-radius:24px;background:radial-gradient(circle at center,#123b78,#061a3d 62%,#041128);position:relative;overflow:hidden;touch-action:manipulation}.pulseTarget{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;background:#fff;color:#075eea;display:grid;place-items:center;box-shadow:0 0 0 10px #fff2,0 0 40px #4fa0ff;animation:pulsoTarget .65s ease-in-out infinite}.pulseTarget svg{width:42%}@keyframes pulsoTarget{50%{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 0 18px #fff1,0 0 58px #66b0ff}}.gameCenter{position:absolute;inset:0;display:grid;place-items:center;align-content:center;color:#fff;text-align:center;padding:30px}.gameCenter>svg{width:44px;height:44px;margin-bottom:10px}.gameCenter strong{font-size:58px}.gameCenter b{font-size:18px}.gameCenter span{font-size:11px;color:#b9cbea;margin-top:7px}.gameFooter{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:14px}.gameFooter small{color:#718197}.gameFooter .primary{border:0;border-radius:13px;padding:12px 18px;background:#075eea;color:#fff;font-weight:900}.pulsoGame .modalClose{position:absolute;right:17px;top:17px}@media(max-width:620px){.phoneFeatureRow{grid-template-columns:1fr}.shareCTA{justify-content:center;padding:13px}.gameStage{height:330px}.gameFooter{align-items:stretch;flex-direction:column}.gameFooter .primary{width:100%}}\n'
          css.write_text(c,encoding='utf-8')
          for f in ['.github/workflows/hocco-phone-features-once.yml','.github/workflows/hocco-phone-features-once-v2.yml']:
            q=Path(f)
            if q.exists(): q.unlink()
      - name: Validar build
        working-directory: impulsionadores
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publicar
        run: |
          git config user.name "HOCCO Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add impulsionadores/app/app/page.js impulsionadores/app/living.css .github/workflows/
          git commit -m "impulsionadores: adiciona Pulso, haptics, share e badge"
          git push origin HEAD:main
