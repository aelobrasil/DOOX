name: Validate HOCCO Message Release

on:
  push:
    branches:
      - 'hocco-message/release-readiness-*'
      - 'hocco-message/banner-empresas-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check syntax
        working-directory: hocco-message
        run: |
          node --check dist/city-offers.mjs
          node --check dist/cinema.mjs
      - name: Run full application regression suite
        working-directory: hocco-message
        run: npm test
