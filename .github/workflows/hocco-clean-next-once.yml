name: HOCCO cleanup Next build

on:
  push:
    paths:
      - '.github/workflows/hocco-clean-next-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Remover artefatos gerados
        run: |
          git rm -r --cached --ignore-unmatch impulsionadores/.next
          rm -rf impulsionadores/.next
          rm .github/workflows/hocco-clean-next-once.yml
      - name: Publicar limpeza
        run: |
          git config user.name "HOCCO Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add impulsionadores/.gitignore .github/workflows/hocco-clean-next-once.yml
          git commit -m "chore: remove artefatos .next do repositório"
          git push origin HEAD:main
