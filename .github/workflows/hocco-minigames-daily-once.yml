name: HOCCO minigames daily

on:
  push:
    paths:
      - '.github/workflows/hocco-minigames-daily-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Aplicar sistema de minigames
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('impulsionadores/app/app/page.js')
          s=p.read_text(encoding='utf-8')
          def rep(old,new):
            global s
            if old not in s: raise SystemExit('Âncora membro ausente: '+old[:120])
            s=s.replace(old,new,1)

          rep("import { pixPayload } from '../../lib/pix';", "import { pixPayload } from '../../lib/pix';\nimport { MINIGAMES, MiniGamesModal } from '../components/Minigames';")
          rep("  const [youtubeVisited, setYoutubeVisited] = useState(false);\n  const [pulsoDone, setPulsoDone] = useState(false);\n  const [gameOpen, setGameOpen] = useState(false);", "  const [youtubeVisited, setYoutubeVisited] = useState(false);\n  const [dailyGame, setDailyGame] = useState('pulso');\n  const [miniGameDone, setMiniGameDone] = useState(false);\n  const [gameOpen, setGameOpen] = useState(false);\n  const [appInstalled, setAppInstalled] = useState(false);")
          rep("    const installHandler = (event) => { event.preventDefault(); setInstallPrompt(event); };\n    window.addEventListener('beforeinstallprompt', installHandler);", "    const installedNow = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true || localStorage.getItem('hocco_app_installed') === '1';\n    if (installedNow) { setAppInstalled(true); localStorage.setItem('hocco_app_installed', '1'); }\n    const installHandler = (event) => { event.preventDefault(); if (!installedNow) setInstallPrompt(event); };\n    const installedHandler = () => { localStorage.setItem('hocco_app_installed', '1'); setAppInstalled(true); setInstallPrompt(null); };\n    window.addEventListener('beforeinstallprompt', installHandler);\n    window.addEventListener('appinstalled', installedHandler);")
          rep("      window.removeEventListener('beforeinstallprompt', installHandler);\n      clearInterval(ticker);", "      window.removeEventListener('beforeinstallprompt', installHandler);\n      window.removeEventListener('appinstalled', installedHandler);\n      clearInterval(ticker);")
          rep("    const pending = (Number(daily.hc_earned || 0) < 2 ? 1 : 0) + (youtubeVisited ? 0 : 1) + (pulsoDone ? 0 : 1);", "    const pending = (Number(daily.hc_earned || 0) < 2 ? 1 : 0) + (youtubeVisited ? 0 : 1) + (miniGameDone ? 0 : 1);")
          rep("  }, [daily, youtubeVisited, pulsoDone]);", "  }, [daily, youtubeVisited, miniGameDone]);")

          old_load="""  async function loadDaily(currentUser = user) {
    const date = todayBR();
    const [{ data: hcData }, { data: youtubeMission }, { data: pulsoMission }] = await Promise.all([
      supabase.from('hc_diario').select('*').eq('user_id', currentUser.id).eq('activity_date', date).maybeSingle(),
      supabase.from('impulsionadores_missoes_diarias').select('mission_key').eq('user_id', currentUser.id).eq('mission_date', date).eq('mission_key', 'youtube_channel_visit').maybeSingle(),
      supabase.from('impulsionadores_missoes_diarias').select('mission_key').eq('user_id', currentUser.id).eq('mission_date', date).eq('mission_key', 'pulso_daily').maybeSingle(),
    ]);
    setDaily(hcData || { hc_earned: 0, missions_completed: 1, boards_hyped: 0 });
    setYoutubeVisited(Boolean(youtubeMission));
    setPulsoDone(Boolean(pulsoMission));
  }"""
          new_load="""  async function loadDaily(currentUser = user) {
    const date = todayBR();
    const [{ data: hcData }, { data: youtubeMission }, { data: gameMission }, { data: selectedGame }] = await Promise.all([
      supabase.from('hc_diario').select('*').eq('user_id', currentUser.id).eq('activity_date', date).maybeSingle(),
      supabase.from('impulsionadores_missoes_diarias').select('mission_key').eq('user_id', currentUser.id).eq('mission_date', date).eq('mission_key', 'youtube_channel_visit').maybeSingle(),
      supabase.from('impulsionadores_missoes_diarias').select('mission_key,metadata').eq('user_id', currentUser.id).eq('mission_date', date).eq('mission_key', 'minigame_daily').maybeSingle(),
      supabase.rpc('get_daily_minigame'),
    ]);
    setDaily(hcData || { hc_earned: 0, missions_completed: 1, boards_hyped: 0 });
    setYoutubeVisited(Boolean(youtubeMission));
    setDailyGame(selectedGame || 'pulso');
    setMiniGameDone(Boolean(gameMission));
  }"""
          rep(old_load,new_load)

          old_complete=re.search(r"  async function completePulso\(result\) \{.*?\n  \}\n  async function visitYoutube",s,re.S)
          if not old_complete: raise SystemExit('Função completePulso não encontrada')
          new_complete="""  async function completeMiniGame(gameKey, result) {
    haptic([20,35,20]);
    await logEvent('minigame_play', 'minigame', gameKey, result);
    if (gameKey !== dailyGame) return showToast(`${MINIGAMES[gameKey]?.name || 'Minigame'} concluído: ${result.score} pontos. Hoje a missão é ${MINIGAMES[dailyGame]?.name || 'outro jogo'}.`);
    if (miniGameDone) return showToast(`Missão diária já concluída. Resultado: ${result.score} pontos.`);
    const { data: awarded, error } = await supabase.rpc('complete_daily_minigame', { p_game_key: gameKey, p_result: result });
    if (error) return showToast('Partida concluída, mas o XP não pôde ser registrado. Tente novamente.');
    setMiniGameDone(true);
    await Promise.all([loadDaily(), loadProfile(), loadCommunity()]);
    showToast(awarded ? `${MINIGAMES[gameKey]?.name}: missão concluída. +5 XP.` : 'Missão diária já estava concluída.');
  }
  async function visitYoutube"""
          s=s[:old_complete.start()]+new_complete+s[old_complete.end():]

          old_install="""  async function install() {
    if (installPrompt) { installPrompt.prompt(); await installPrompt.userChoice; setInstallPrompt(null); }
    else alert('No celular, abra o menu do navegador e escolha “Adicionar à tela inicial” ou “Instalar app”.');
  }"""
          new_install="""  async function install() {
    if (appInstalled) return;
    if (installPrompt) {
      installPrompt.prompt();
      const choice = await installPrompt.userChoice;
      setInstallPrompt(null);
      if (choice?.outcome === 'accepted') { localStorage.setItem('hocco_app_installed', '1'); setAppInstalled(true); }
    } else alert('No celular, abra o menu do navegador e escolha “Adicionar à tela inicial” ou “Instalar app”.');
  }"""
          rep(old_install,new_install)
          rep("  const dailyMissions = 1 + Math.min(3, boardsHyped) + (youtubeVisited ? 1 : 0) + (pulsoDone ? 1 : 0);", "  const dailyMissions = 1 + Math.min(3, boardsHyped) + (youtubeVisited ? 1 : 0) + (miniGameDone ? 1 : 0);")
          rep("<button type=\"button\" className={pulsoDone?'microMission done':'microMission'} onClick={()=>setGameOpen(true)}><Gamepad2/><span>Pulso HOCCO</span><b>{pulsoDone?'JOGAR · XP FEITO':'+5 XP'}</b></button>", "<button type=\"button\" className={miniGameDone?'microMission done':'microMission'} onClick={()=>setGameOpen(true)}><Gamepad2/><span>{MINIGAMES[dailyGame]?.name||'Minigame HOCCO'}</span><b>{miniGameDone?'MISSÃO FEITA':'+5 XP'}</b></button>")
          rep("<div className=\"phoneFeatureRow\"><button className=\"pulsoCTA\" onClick={()=>setGameOpen(true)}><Gamepad2/><div><b>Pulso HOCCO</b><span>30 segundos · recorde pessoal · sem gastar HC</span></div><ChevronRight/></button>", "<div className=\"phoneFeatureRow\"><button className=\"pulsoCTA\" onClick={()=>setGameOpen(true)}><Gamepad2/><div><b>Minigames HOCCO</b><span>5 jogos · missão de hoje: {MINIGAMES[dailyGame]?.short||'Pulso'} · sem gastar HC</span></div><ChevronRight/></button>")
          rep("        <button className=\"installCard\" onClick={install}><Download/><div><b>Instalar HOCCO no celular</b><span>Abra mais rápido e mantenha sua conta sincronizada.</span></div></button>", "        {!appInstalled&&<button className=\"installCard\" onClick={install}><Download/><div><b>Instalar HOCCO no celular</b><span>Abra mais rápido e mantenha sua conta sincronizada.</span></div></button>}")
          rep("<button type=\"button\" className={pulsoDone?'missionRow done':'missionRow'} onClick={()=>setGameOpen(true)}><span><Gamepad2/></span><div><b>Pulso HOCCO</b><small>Jogue uma partida de 30 segundos. A primeira do dia rende XP.</small></div><em>{pulsoDone?'XP DO DIA FEITO':'+5 XP'}</em></button>", "<button type=\"button\" className={miniGameDone?'missionRow done':'missionRow'} onClick={()=>setGameOpen(true)}><span><Gamepad2/></span><div><b>{MINIGAMES[dailyGame]?.name||'Minigame HOCCO'}</b><small>Jogo escolhido pelo sistema para a missão de hoje.</small></div><em>{miniGameDone?'MISSÃO FEITA':'+5 XP'}</em></button>")
          rep("<button className=\"outline\" onClick={install}><Download/> INSTALAR APP</button>", "{!appInstalled&&<button className=\"outline\" onClick={install}><Download/> INSTALAR APP</button>}")
          rep("    {gameOpen&&<PulsoGame doneToday={pulsoDone} onFinish={completePulso} onClose={()=>setGameOpen(false)}/>}\n", "    {gameOpen&&<MiniGamesModal dailyGame={dailyGame} doneToday={miniGameDone} onFinish={completeMiniGame} onClose={()=>setGameOpen(false)}/>}\n")
          s2,n=re.subn(r"\nfunction PulsoGame\(.*?\nfunction CompanyModal", "\nfunction CompanyModal", s, count=1, flags=re.S)
          if n!=1: raise SystemExit('Componente PulsoGame antigo não removido')
          p.write_text(s2,encoding='utf-8')

          # Login/public page: remember completed installation and never show installer again on this device.
          p=Path('impulsionadores/app/page.js'); s=p.read_text(encoding='utf-8')
          def rep2(old,new):
            global s
            if old not in s: raise SystemExit('Âncora login ausente: '+old[:120])
            s=s.replace(old,new,1)
          rep2("  const [installPrompt, setInstallPrompt] = useState(null);", "  const [installPrompt, setInstallPrompt] = useState(null);\n  const [appInstalled, setAppInstalled] = useState(false);")
          old_effect="""    const handler = (event) => { event.preventDefault(); setInstallPrompt(event); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);"""
          new_effect="""    const installedNow = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true || localStorage.getItem('hocco_app_installed') === '1';
    if (installedNow) { setAppInstalled(true); localStorage.setItem('hocco_app_installed', '1'); }
    const handler = (event) => { event.preventDefault(); if (!installedNow) setInstallPrompt(event); };
    const installedHandler = () => { localStorage.setItem('hocco_app_installed', '1'); setAppInstalled(true); setInstallPrompt(null); };
    window.addEventListener('beforeinstallprompt', handler);
    window.addEventListener('appinstalled', installedHandler);
    return () => { window.removeEventListener('beforeinstallprompt', handler); window.removeEventListener('appinstalled', installedHandler); };"""
          rep2(old_effect,new_effect)
          old_install2="""  async function install() {
    if (installPrompt) { installPrompt.prompt(); await installPrompt.userChoice; setInstallPrompt(null); }
    else alert('No celular, abra o menu do navegador e escolha “Adicionar à tela inicial” ou “Instalar app”.');
  }"""
          new_install2="""  async function install() {
    if (appInstalled) return;
    if (installPrompt) {
      installPrompt.prompt(); const choice = await installPrompt.userChoice; setInstallPrompt(null);
      if (choice?.outcome === 'accepted') { localStorage.setItem('hocco_app_installed', '1'); setAppInstalled(true); }
    } else alert('No celular, abra o menu do navegador e escolha “Adicionar à tela inicial” ou “Instalar app”.');
  }"""
          rep2(old_install2,new_install2)
          rep2("    <button className=\"downloadAuth\" onClick={install}><Download/> Baixar app no celular</button>", "    {!appInstalled&&<button className=\"downloadAuth\" onClick={install}><Download/> Baixar app no celular</button>}")
          p.write_text(s,encoding='utf-8')

          Path('.github/workflows/hocco-minigames-daily-once.yml').unlink()

      - name: Validar build
        working-directory: impulsionadores
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publicar
        run: |
          git config user.name "HOCCO Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add impulsionadores/app/app/page.js impulsionadores/app/page.js impulsionadores/app/components/Minigames.js impulsionadores/app/components/Minigames.module.css .github/workflows/
          git commit -m "impulsionadores: cinco minigames, missão diária e instalador persistente"
          git push origin HEAD:main
