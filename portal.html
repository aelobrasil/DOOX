<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0e7">
<title>HOCCO — Você chegou no meio da história</title>
<style>
:root{--bg:#f5f0e7;--paper:#fffaf2;--ink:#090908;--muted:#625d55;--line:#d8d0c3;--orange:#ff5a16}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;opacity:0;transition:opacity .28s ease}body.ready{opacity:1}body.leaving{opacity:.15}.route-cover{position:fixed;inset:0;background:var(--orange);z-index:99999;transform:translateX(-105%);pointer-events:none}.route-cover.go{animation:route .48s cubic-bezier(.7,0,.2,1)}@keyframes route{0%{transform:translateX(-105%)}48%{transform:translateX(0)}52%{transform:translateX(0)}100%{transform:translateX(105%)}}
#portalNav{position:sticky;top:12px;z-index:9990;width:min(calc(100% - 24px),1440px);margin:12px auto 0;background:rgba(255,250,242,.94);backdrop-filter:blur(18px);border:1px solid rgba(9,9,8,.09);border-radius:999px;display:flex;align-items:center;padding:10px 14px 10px 20px;gap:18px}.pbrand{font-size:22px;font-weight:950;letter-spacing:5px}.pnav{margin-left:auto;display:flex;align-items:center;gap:6px}.pnav a{color:var(--ink);text-decoration:none;font-size:11px;font-weight:850;padding:11px 13px;border-radius:999px}.pnav a.active{background:#090908;color:#fff}.pnav a.cta{background:var(--orange);color:#fff;padding-inline:18px}.pnav i{font-style:normal;color:var(--orange);margin-right:5px}.menu{display:none;background:#090908;color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:18px}.portal-title{width:min(calc(100% - 36px),1240px);margin:clamp(42px,7vw,88px) auto 22px}.portal-title small{display:block;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.15em;margin-bottom:12px}.portal-title h1{font-size:clamp(48px,7vw,96px);line-height:.9;letter-spacing:-.06em;margin:0;max-width:980px}.portal-title p{font-size:16px;color:var(--muted);line-height:1.6;max-width:650px}.portal-loading{min-height:55vh;display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--muted)}
/* isolate each real route while preserving the complete legacy DOM and logic */
body[data-route="home"] main>section:not(.v95-home),body[data-route="empresas"] main>section:not(#empresa-ho),body[data-route="insercoes"] main>section:not(#formatos):not(#publicidade-contextual),body[data-route="simulacao"] main>section:not(#simulacao),body[data-route="participar"] main>section:not(#participar),body[data-route="acompanhar"] main>section:not(#acompanhar){display:none!important}#legacyMount>header{display:none!important}body[data-route="home"] .portal-title{display:none}.doox-footer-min{margin-top:50px!important}
@media(max-width:900px){#portalNav{border-radius:28px;align-items:flex-start}.menu{display:block;margin-left:auto}.pnav{display:none;position:absolute;left:0;right:0;top:58px;margin:0;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:12px;flex-direction:column;align-items:stretch}.pnav.open{display:flex}.pnav a{padding:14px 16px}.pnav a.cta{text-align:center}}
</style>
</head>
<body><div class="route-cover" id="cover"></div>
<nav id="portalNav"><a class="pbrand navgo" href="/">HOCCO</a><button class="menu" id="menu" aria-label="Menu">☰</button><div class="pnav" id="pnav"><a class="navgo" data-r="home" href="/"><i>01</i>SÉRIE</a><a class="navgo" data-r="empresas" href="/empresas"><i>02</i>EMPRESAS</a><a class="navgo" data-r="insercoes" href="/insercoes"><i>03</i>INSERÇÕES</a><a class="navgo" data-r="simulacao" href="/simulacao"><i>04</i>SIMULAÇÃO</a><a class="navgo" data-r="acompanhar" href="/acompanhar">ACOMPANHAR</a><a class="navgo cta" data-r="participar" href="/participar">PARTICIPAR →</a></div></nav>
<div class="portal-title" id="pt"><small id="pk"></small><h1 id="ph"></h1><p id="pp"></p></div><div id="legacyMount"><div class="portal-loading">CARREGANDO HOCCO</div></div>
<script>
(()=>{const path=location.pathname.replace(/\/+$/,'')||'/';const map={'/':'home','/serie':'home','/empresas':'empresas','/insercoes':'insercoes','/simulacao':'simulacao','/participar':'participar','/acompanhar':'acompanhar'};const route=map[path]||'home';document.body.dataset.route=route;const copy={empresas:['PARA EMPRESAS','Sua empresa dentro da história.','Experiência real e publicidade são operações diferentes.'],insercoes:['FORMATOS HOCCO','Presença que faz parte da cena.','Conheça as modalidades comerciais e como cada inserção entra na narrativa.'],simulacao:['SIMULAÇÃO INTERATIVA','Veja sua marca dentro da HOCCO.','Teste visualmente cada formato antes de criar sua solicitação.'],participar:['PARTICIPAR','Entre na história.','Escolha sua participação, envie dados e materiais, revise e finalize sua solicitação.'],acompanhar:['ACOMPANHAMENTO','Sua solicitação, em um só lugar.','Consulte o pedido com seu código DOOX e token privado.']};if(copy[route]){pk.textContent=copy[route][0];ph.textContent=copy[route][1];pp.textContent=copy[route][2]}document.querySelector('[data-r="'+route+'"]')?.classList.add('active');menu.onclick=()=>pnav.classList.toggle('open');
const go=(a,e)=>{if(e)e.preventDefault();const href=a.getAttribute('href');if(!href||href===location.pathname)return;cover.classList.add('go');document.body.classList.add('leaving');setTimeout(()=>location.href=href,230)};document.querySelectorAll('.navgo').forEach(a=>a.addEventListener('click',e=>go(a,e)));
fetch('/index.html?portal=1',{cache:'no-store'}).then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');const mount=document.getElementById('legacyMount');const main=doc.querySelector('main'),footer=doc.querySelector('footer');mount.innerHTML='';if(main)mount.appendChild(main.cloneNode(true));if(footer)mount.appendChild(footer.cloneNode(true));doc.body.querySelectorAll(':scope > div').forEach(el=>{if(/modal|overlay/i.test(el.className||'')||el.id)mount.appendChild(el.cloneNode(true))});
const scripts=[...doc.querySelectorAll('script')];let chain=Promise.resolve();scripts.forEach(old=>{chain=chain.then(()=>new Promise(resolve=>{const s=document.createElement('script');[...old.attributes].forEach(a=>s.setAttribute(a.name,a.value));if(old.src){s.onload=resolve;s.onerror=resolve;s.src=old.src+(old.src.includes('?')?'&':'?')+'portal=107';document.body.appendChild(s)}else{s.textContent=old.textContent;document.body.appendChild(s);resolve()}}))});return chain}).then(()=>{document.querySelectorAll('[data-scroll]').forEach(el=>{const id=el.dataset.scroll;const routes={participar:'/participar',simulacao:'/simulacao',formatos:'/insercoes',acompanhar:'/acompanhar','empresa-ho':'/empresas'};if(routes[id])el.onclick=e=>{e.preventDefault();go(Object.assign(document.createElement('a'),{href:routes[id],getAttribute:n=>n==='href'?routes[id]:null}),e)}});document.body.classList.add('ready')}).catch(err=>{legacyMount.innerHTML='<div class="portal-loading">Não foi possível carregar esta área. Atualize a página.</div>';console.error(err);document.body.classList.add('ready')});setTimeout(()=>document.body.classList.add('ready'),1200)})();
</script></body></html>
