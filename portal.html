<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0e7"><meta name="description" content="HOCCO — Você chegou no meio da história. Série, empresas, inserções, simulação, participação e acompanhamento."><title>HOCCO — Você chegou no meio da história</title>
<style>
:root{--bg:#f5f0e7;--paper:#fffaf2;--ink:#090908;--muted:#625d55;--line:#d8d0c3;--orange:#ff5a16}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;opacity:0;transition:opacity .24s ease}body.ready{opacity:1}body.leaving{opacity:.2}.route-cover{position:fixed;inset:0;background:var(--orange);z-index:99999;transform:translateX(-105%);pointer-events:none}.route-cover.go{animation:route .46s cubic-bezier(.7,0,.2,1)}@keyframes route{0%{transform:translateX(-105%)}48%,52%{transform:translateX(0)}100%{transform:translateX(105%)}}
#portalNav{position:sticky;top:12px;z-index:9990;width:min(calc(100% - 24px),1440px);margin:12px auto 0;background:rgba(255,250,242,.95);backdrop-filter:blur(18px);border:1px solid rgba(9,9,8,.09);border-radius:999px;display:flex;align-items:center;padding:10px 14px 10px 20px;gap:18px}.pbrand{font-size:22px;font-weight:950;letter-spacing:5px;color:var(--ink);text-decoration:none}.pnav{margin-left:auto;display:flex;align-items:center;gap:6px}.pnav a{color:var(--ink);text-decoration:none;font-size:11px;font-weight:850;padding:11px 13px;border-radius:999px}.pnav a.active{background:#090908;color:#fff}.pnav a.cta{background:var(--orange);color:#fff;padding-inline:18px}.pnav i{font-style:normal;color:var(--orange);margin-right:5px}.menu{display:none;background:#090908;color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:18px}.portal-title{width:min(calc(100% - 36px),1240px);margin:clamp(42px,7vw,88px) auto 20px}.portal-title small{display:block;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.15em;margin-bottom:12px}.portal-title h1{font-size:clamp(48px,7vw,96px);line-height:.9;letter-spacing:-.06em;margin:0;max-width:1040px}.portal-title p{font-size:16px;color:var(--muted);line-height:1.6;max-width:700px}.portal-loading{min-height:55vh;display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--muted)}
#legacyMount>header{display:none!important}.doox-footer-min{margin-top:50px!important}body[data-route="home"] .portal-title{display:none}
body[data-route="home"] main>section:not(.v95-home):not(#empresa-ho):not(#formatos),body[data-route="empresas"] main>section:not(#empresa-ho):not(#publicidade-contextual),body[data-route="insercoes"] main>section:not(#formatos):not(#publicidade-contextual),body[data-route="simulacao"] main>section:not(#simulacao):not(#formatos),body[data-route="participar"] main>section:not(#participar):not(#formatos),body[data-route="acompanhar"] main>section:not(#acompanhar){display:none!important}
.route-bridge{width:min(calc(100% - 36px),1240px);margin:34px auto 0;padding:22px 0;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}.route-bridge a{border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--ink);text-decoration:none;font-size:11px;font-weight:900}.route-bridge a.primary{background:var(--orange);border-color:var(--orange);color:#fff}
@media(max-width:900px){#portalNav{border-radius:28px;align-items:flex-start}.menu{display:block;margin-left:auto}.pnav{display:none;position:absolute;left:0;right:0;top:58px;margin:0;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:12px;flex-direction:column;align-items:stretch}.pnav.open{display:flex}.pnav a{padding:14px 16px}.pnav a.cta{text-align:center}}
</style></head><body><div class="route-cover" id="cover"></div>
<nav id="portalNav"><a class="pbrand navgo" href="/">HOCCO</a><button class="menu" id="menu" aria-label="Menu">☰</button><div class="pnav" id="pnav"><a class="navgo" data-r="home" href="/"><i>01</i>SÉRIE</a><a class="navgo" data-r="empresas" href="/empresas"><i>02</i>EMPRESAS</a><a class="navgo" data-r="insercoes" href="/insercoes"><i>03</i>INSERÇÕES</a><a class="navgo" data-r="simulacao" href="/simulacao"><i>04</i>SIMULAÇÃO</a><a class="navgo" data-r="acompanhar" href="/acompanhar">ACOMPANHAR</a><a class="navgo cta" data-r="participar" href="/participar">PARTICIPAR →</a></div></nav>
<div class="portal-title" id="pt"><small id="pk"></small><h1 id="ph"></h1><p id="pp"></p></div><div id="legacyMount"><div class="portal-loading">CARREGANDO HOCCO</div></div>
<script>
(()=>{const path=location.pathname.replace(/\/+$/,'')||'/';const map={'/':'home','/serie':'home','/empresas':'empresas','/insercoes':'insercoes','/simulacao':'simulacao','/participar':'participar','/acompanhar':'acompanhar'};const route=map[path]||'home';document.body.dataset.route=route;const copy={empresas:['PARA EMPRESAS','Sua empresa dentro da história.','Experiência editorial sem cobrança e publicidade controlada são operações diferentes. Aqui ficam os benefícios, regras e caminhos comerciais para empresas.'],insercoes:['INSERÇÕES HOCCO','Presença que faz parte da cena.','Todas as modalidades, preços, funcionamento e publicidade dentro da narrativa permanecem reunidos nesta área comercial.'],simulacao:['SIMULAÇÃO INTERATIVA','Veja sua marca dentro da HOCCO.','Teste os formatos e entenda visualmente como a inserção aparece antes de montar a solicitação.'],participar:['PARTICIPAR','Entre na história.','Fluxo completo: participação, modalidade, quantidade, dados, materiais, revisão, termos e fechamento do pedido.'],acompanhar:['ACOMPANHAMENTO','Sua solicitação, em um só lugar.','Consulte status, pagamento, materiais, produção e publicação com seu código DOOX e token privado.']};if(copy[route]){pk.textContent=copy[route][0];ph.textContent=copy[route][1];pp.textContent=copy[route][2]}document.querySelector('[data-r="'+route+'"]')?.classList.add('active');menu.onclick=()=>pnav.classList.toggle('open');
const navigate=href=>{if(!href||href===location.pathname)return;cover.classList.add('go');document.body.classList.add('leaving');setTimeout(()=>location.href=href,220)};document.querySelectorAll('.navgo').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();navigate(a.getAttribute('href'))}));
fetch('/index.html?portal=108',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Base HOCCO indisponível');return r.text()}).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html'),mount=document.getElementById('legacyMount'),main=doc.querySelector('main'),footer=doc.querySelector('footer');mount.innerHTML='';if(main)mount.appendChild(main.cloneNode(true));if(footer)mount.appendChild(footer.cloneNode(true));doc.body.querySelectorAll(':scope > div').forEach(el=>{if(/modal|overlay/i.test(el.className||'')||el.id)mount.appendChild(el.cloneNode(true))});
const bridge=document.createElement('nav');bridge.className='route-bridge';bridge.innerHTML=route==='home'?'<a class="navgo2" href="/empresas">EMPRESAS →</a><a class="navgo2" href="/insercoes">VER INSERÇÕES →</a><a class="navgo2 primary" href="/participar">PARTICIPAR →</a>':route==='empresas'?'<a class="navgo2" href="/insercoes">CONHECER INSERÇÕES →</a><a class="navgo2 primary" href="/participar">QUERO PARTICIPAR →</a>':route==='insercoes'?'<a class="navgo2" href="/simulacao">ABRIR SIMULAÇÃO →</a><a class="navgo2 primary" href="/participar">MONTAR SOLICITAÇÃO →</a>':route==='simulacao'?'<a class="navgo2" href="/insercoes">VOLTAR ÀS MODALIDADES</a><a class="navgo2 primary" href="/participar">SOLICITAR PARTICIPAÇÃO →</a>':route==='participar'?'<a class="navgo2" href="/simulacao">SIMULAR ANTES</a><a class="navgo2" href="/acompanhar">JÁ TENHO UM PEDIDO →</a>':'<a class="navgo2" href="/participar">NOVA SOLICITAÇÃO →</a><a class="navgo2" href="/">VOLTAR À HOCCO</a>';mount.appendChild(bridge);
const scripts=[...doc.querySelectorAll('script')];let chain=Promise.resolve();scripts.forEach(old=>{chain=chain.then(()=>new Promise(resolve=>{const s=document.createElement('script');[...old.attributes].forEach(a=>s.setAttribute(a.name,a.value));if(old.src){s.onload=resolve;s.onerror=resolve;s.src=old.src+(old.src.includes('?')?'&':'?')+'portal=108';document.body.appendChild(s)}else{s.textContent=old.textContent;document.body.appendChild(s);resolve()}}))});return chain}).then(()=>{const routes={participar:'/participar',simulacao:'/simulacao',formatos:'/insercoes',acompanhar:'/acompanhar','empresa-ho':'/empresas'};document.querySelectorAll('[data-scroll]').forEach(el=>{const href=routes[el.dataset.scroll];if(href)el.onclick=e=>{e.preventDefault();navigate(href)}});document.querySelectorAll('.cardChoose').forEach(b=>{const mode=b.dataset.mode;b.onclick=()=>{try{sessionStorage.setItem('hocco:preferredMode',mode)}catch(_){}navigate('/participar')}});document.querySelectorAll('.navgo2').forEach(a=>a.onclick=e=>{e.preventDefault();navigate(a.getAttribute('href'))});document.body.classList.add('ready')}).catch(err=>{legacyMount.innerHTML='<div class="portal-loading">Não foi possível carregar esta área. Atualize a página.</div>';console.error(err);document.body.classList.add('ready')});setTimeout(()=>document.body.classList.add('ready'),1400)})();
</script></body></html>
