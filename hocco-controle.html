<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>HOCCO Controle</title><style>
:root{--bg:#090a0d;--p:#121419;--p2:#181b21;--line:#2a2e36;--t:#f5f6f8;--m:#929aa5;--o:#ff6a00;--g:#47d891;--r:#ff6872}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.card,.panel{background:var(--p);border:1px solid var(--line);border-radius:18px}.login .card{width:min(430px,100%);padding:28px}.brand{font-weight:950;font-size:22px}.brand i{display:inline-block;width:9px;height:9px;background:var(--o);border-radius:50%;margin-left:4px}.muted{color:var(--m)}input,select,textarea{width:100%;background:#0d0f13;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}.btn{border:1px solid var(--line);background:var(--p2);color:#fff;border-radius:9px;padding:10px 12px;font-weight:850;font-size:11px;cursor:pointer}.primary{background:var(--o);border-color:var(--o)}.green{color:#8ff0bb}.red{color:#ff9da4}.full{width:100%;margin-top:12px}.shell{display:none}.top{position:sticky;top:0;background:#090a0df2;border-bottom:1px solid var(--line);z-index:5}.topin,.main{max-width:1450px;margin:auto;padding:14px 18px}.topin{display:flex;align-items:center;gap:12px}.topin .actions{margin-left:auto}.main{padding-top:25px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end}.hero h1{font-size:36px;margin:3px 0}.search{max-width:430px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:18px 0}.metric{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:13px}.metric span{font-size:9px;color:var(--m);text-transform:uppercase}.metric b{display:block;font-size:22px;margin-top:7px}.panel{overflow:hidden}.ph{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.ph b{margin-right:auto}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:11px 12px;border-bottom:1px solid #ffffff0d;text-align:left;font-size:11px}th{color:var(--m);font-size:9px;text-transform:uppercase}.status{border:1px solid #39404a;border-radius:99px;padding:4px 7px;font-size:9px;font-weight:900}.drawerbg{position:fixed;inset:0;background:#000a;display:none;z-index:10}.drawer{position:fixed;right:0;top:0;width:min(700px,100%);height:100%;background:#0d0f13;border-left:1px solid var(--line);display:none;z-index:11;overflow:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:10px}.box h3{font-size:10px;color:var(--m);text-transform:uppercase}.kv{display:grid;grid-template-columns:120px 1fr;gap:7px;font-size:11px}.kv span:nth-child(odd){color:var(--m)}.actions{display:flex;gap:7px;flex-wrap:wrap}.hist{border-left:2px solid #3a4048;padding-left:9px;margin:9px 0;font-size:11px}.err{color:#ff9da4;font-size:11px;margin-top:9px}.adminnav{display:flex;gap:8px;margin-top:18px}.episode-map{padding:16px}.episode{background:#0d0f13;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:12px}.episode-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.episode-head h3{margin:0}.timeline{position:relative;height:90px;margin-top:16px;border-radius:12px;background:linear-gradient(90deg,#12151a,#191c22);border:1px solid #292e36;overflow:hidden}.timeline:before{content:"00:00";position:absolute;left:8px;bottom:7px;color:var(--m);font-size:8px}.timeline:after{content:"12:00";position:absolute;right:8px;bottom:7px;color:var(--m);font-size:8px}.slot{position:absolute;top:14px;transform:translateX(-50%);max-width:145px;background:var(--o);color:#fff;border-radius:8px;padding:7px 8px;font-size:8px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot small{display:block;opacity:.75;font-size:7px;margin-top:2px}.empty-map{padding:30px;color:var(--m);text-align:center}@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.hero{display:block}.search{max-width:none;margin-top:12px}.grid{grid-template-columns:1fr}}</style></head><body>
<section class="login" id="login"><div class="card"><div class="brand">HOCCO Controle<i></i></div><h1>Área privada</h1><p class="muted">Solicitações, acompanhamento e confirmação manual de pagamentos Pix.</p><form id="loginForm"><input id="password" type="password" placeholder="Senha administrativa" autocomplete="current-password" required><button class="btn primary full">ENTRAR</button><div class="err" id="loginError"></div></form></div></section>
<div class="shell" id="shell"><header class="top"><div class="topin"><div class="brand">HOCCO Controle<i></i></div><span class="muted">● Supabase</span><div class="actions"><button class="btn" id="refresh">ATUALIZAR</button><button class="btn red" id="logout">SAIR</button></div></div></header><main class="main"><div class="hero"><div><div class="muted">OPERAÇÃO HOCCO</div><h1>Solicitações</h1><div class="muted">Status, pagamentos e histórico em um único lugar.</div></div><input class="search" id="search" placeholder="Solicitação, cliente, empresa, WhatsApp ou e-mail"></div><div class="adminnav"><button class="btn primary" id="navRequests">SOLICITAÇÕES</button><button class="btn" id="navEpisodes">MAPA DE EPISÓDIOS</button></div><div class="metrics" id="metrics"></div><section class="panel" id="requestsPanel"><div class="ph"><b id="count">Solicitações</b><select id="filter" style="max-width:230px"><option value="">Todos os status</option></select></div><div id="content"></div></section><section class="panel hidden" id="episodesPanel"><div class="ph"><b>Mapa de episódios</b><span class="muted">Posições programadas por tempo</span></div><div id="episodeMap" class="episode-map"></div></section></main></div>
<div class="drawerbg" id="bg"></div><aside class="drawer" id="drawer"><div class="actions"><b id="dnum" style="font-size:20px;margin-right:auto">—</b><button class="btn" id="close">FECHAR</button></div><div id="detail"></div></aside>
<script>
const $=x=>document.getElementById(x),STATUS=['SOLICITADO','EM_ANALISE','AGUARDANDO_PAGAMENTO','PAGAMENTO_RECEBIDO','MATERIAL_PENDENTE','MATERIAL_RECEBIDO','EM_PRODUCAO','PROGRAMADO','PUBLICADO','FINALIZADO','REJEITADO','CANCELADO','ARQUIVADO'];let D={pedidos:[],indicadores:{}},CUR=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0),dt=v=>v?new Date(v).toLocaleString('pt-BR'):'—',st=v=>'<span class="status">'+esc(String(v||'—').replaceAll('_',' '))+'</span>';
async function api(a,b={},method='POST'){const o={method,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'}};if(method!=='GET')o.body=JSON.stringify({action:a,...b});const r=await fetch('/api/hocco-admin-v1?action='+encodeURIComponent(a),o);const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.message||'Falha na operação.');return j}
function show(ok){$('login').style.display=ok?'none':'grid';$('shell').style.display=ok?'block':'none'}async function load(){D=await api('dashboard',{},'GET');render()}
function render(){const i=D.indicadores||{},ms=[['Total',i.total],['Solicitados',i.solicitados],['Em análise',i.em_analise],['Aguard. Pix',i.aguardando_pagamento],['Pagos',i.pagamento_recebido],['Valor solicitado',brl(i.valor_solicitado)]];$('metrics').innerHTML=ms.map(x=>'<div class="metric"><span>'+esc(x[0])+'</span><b>'+esc(x[1]??0)+'</b></div>').join('');const q=$('search').value.toLowerCase(),f=$('filter').value,rows=(D.pedidos||[]).filter(p=>(!f||p.status===f)&&(!q||[p.numero_exibicao,p.nome,p.empresa,p.whatsapp,p.email].some(v=>String(v||'').toLowerCase().includes(q))));$('count').textContent='Solicitações · '+rows.length;$('content').innerHTML=rows.length?'<div class="tablewrap"><table><thead><tr><th>Nº</th><th>Cliente</th><th>Modalidade</th><th>Total</th><th>Status</th><th>Pagamento</th><th>Material</th><th></th></tr></thead><tbody>'+rows.map(p=>'<tr><td><b>'+esc(p.numero_exibicao)+'</b></td><td>'+esc(p.empresa||p.nome)+'</td><td>'+esc(p.modalidade_nome)+'</td><td>'+brl(p.valor_total)+'</td><td>'+st(p.status)+'</td><td>'+st(p.status_pagamento)+'</td><td>'+st(p.status_material)+'</td><td><button class="btn" onclick="openD(\''+p.id+'\')">ABRIR</button></td></tr>').join('')+'</tbody></table></div>':'<p class="muted" style="padding:25px">Nenhuma solicitação.</p>'}
async function showEpisodes(){try{const E=await api('episodios',{},'GET');$('requestsPanel').classList.add('hidden');$('episodesPanel').classList.remove('hidden');$('navRequests').classList.remove('primary');$('navEpisodes').classList.add('primary');const list=E.episodios||[];$('episodeMap').innerHTML=list.length?list.map(e=>{const ps=e.programacoes||[];return '<article class="episode"><div class="episode-head"><div><h3>Episódio '+esc(e.numero)+'</h3><span class="muted">'+esc(e.titulo||'Sem título')+'</span></div>'+st(e.status)+'</div><div class="timeline">'+ps.map(p=>{const sec=Math.max(0,Math.min(720,Number(p.momento_segundos||0))),left=(sec/720*100),s=p.solicitacao||{};return '<div class="slot" style="left:'+left+'%" title="'+esc((s.numero_exibicao||'')+' '+(s.empresa||s.nome||''))+'">'+esc(s.numero_exibicao||'INSERÇÃO')+'<small>'+esc(s.modalidade_nome||'Programada')+' · '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')+'</small></div>'}).join('')+'</div></article>'}).join(''):'<div class="empty-map">Nenhum episódio criado ainda. O mapa será preenchido automaticamente conforme a produção programar as inserções.</div>'}catch(e){$('episodeMap').innerHTML='<div class="empty-map">'+esc(e.message)+'</div>'}}
function showRequests(){$('episodesPanel').classList.add('hidden');$('requestsPanel').classList.remove('hidden');$('navEpisodes').classList.remove('primary');$('navRequests').classList.add('primary')}
async function openD(id){const x=await api('detalhe',{solicitacaoId:id});CUR=x;$('dnum').textContent=x.solicitacao.numero_exibicao;$('bg').style.display=$('drawer').style.display='block';draw()}
function draw(){const p=CUR.solicitacao;$('detail').innerHTML='<div class="grid"><div class="box"><h3>Cliente</h3><div class="kv"><span>Nome</span><b>'+esc(p.nome)+'</b><span>Empresa</span><b>'+esc(p.empresa||'—')+'</b><span>WhatsApp</span><b>'+esc(p.whatsapp||'—')+'</b><span>E-mail</span><b>'+esc(p.email||'—')+'</b></div></div><div class="box"><h3>Solicitação</h3><div class="kv"><span>Modalidade</span><b>'+esc(p.modalidade_nome)+'</b><span>Faixa</span><b>'+esc(p.faixa_nome||'—')+'</b><span>Quantidade</span><b>'+esc(p.quantidade)+'</b><span>Total</span><b>'+brl(p.valor_total)+'</b></div></div></div><div class="box"><h3>Acompanhamento</h3><div class="kv"><span>Status</span><b>'+st(p.status)+'</b><span>Pagamento</span><b>'+st(p.status_pagamento)+'</b><span>Material</span><b>'+st(p.status_material)+'</b></div><div class="actions" style="margin-top:12px"><select id="newStatus" style="max-width:270px">'+STATUS.map(s=>'<option '+(s===p.status?'selected':'')+' value="'+s+'">'+s.replaceAll('_',' ')+'</option>').join('')+'</select><button class="btn primary" onclick="move()">ATUALIZAR STATUS</button></div></div><div class="box"><h3>Pagamento Pix</h3><p>'+brl(p.valor_total)+' · '+st(p.status_pagamento)+'</p><button class="btn green" onclick="pay()">CONFIRMAR PAGAMENTO RECEBIDO</button></div><div class="box"><h3>Histórico</h3>'+(CUR.historico||[]).map(h=>'<div class="hist"><b>'+esc(h.evento)+'</b><div class="muted">'+esc(dt(h.criado_em))+(h.status_novo?' · '+esc(h.status_anterior||'—')+' → '+esc(h.status_novo):'')+(h.observacao?' · '+esc(h.observacao):'')+'</div></div>').join('')+'</div>'}
async function move(){const s=$('newStatus').value,o=prompt('Observação (opcional):')||'';if(!confirm('Atualizar '+CUR.solicitacao.numero_exibicao+' para '+s.replaceAll('_',' ')+'?'))return;await api('alterarStatus',{solicitacaoId:CUR.solicitacao.id,status:s,observacao:o});await load();await openD(CUR.solicitacao.id)}
async function pay(){if(!confirm('Confirmar recebimento Pix de '+brl(CUR.solicitacao.valor_total)+'?'))return;const ref=prompt('Referência/comprovante (opcional):')||'';await api('confirmarPagamento',{solicitacaoId:CUR.solicitacao.id,valor:Number(CUR.solicitacao.valor_total),referencia:ref});await load();await openD(CUR.solicitacao.id)}
$('navEpisodes').onclick=showEpisodes;$('navRequests').onclick=showRequests;
function closeD(){$('bg').style.display=$('drawer').style.display='none';CUR=null}$('filter').innerHTML='<option value="">Todos os status</option>'+STATUS.map(s=>'<option value="'+s+'">'+s.replaceAll('_',' ')+'</option>').join('');$('search').oninput=render;$('filter').onchange=render;$('refresh').onclick=load;$('close').onclick=$('bg').onclick=closeD;
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{const r=await fetch('/api/hocco-admin-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:$('password').value})});const j=await r.json();if(!r.ok)throw Error(j.message||'Falha no login.');$('password').value='';show(true);await load()}catch(x){$('loginError').textContent=x.message}};$('logout').onclick=async()=>{await api('logout');show(false)};(async()=>{try{const s=await api('session',{},'GET');if(s.authenticated){show(true);await load()}else show(false)}catch{show(false)}})();
</script></body></html>
