<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>DOOX Core V2</title>
<style>
:root{--bg:#0a0b0e;--panel:#121419;--panel2:#181b21;--line:#2a2e36;--text:#f4f6f8;--muted:#939ba6;--orange:#ff6a00;--green:#36d98b;--red:#ff6872;--blue:#6ea8ff;--r:16px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px}.brand{font-size:24px;font-weight:950;letter-spacing:-1px}.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--orange);margin-left:3px}.eyebrow{font-size:10px;letter-spacing:1.7px;color:#ff9d5a;font-weight:900;text-transform:uppercase}.muted{color:var(--muted);line-height:1.5}.field{display:grid;gap:7px;margin-top:16px}.field label{font-size:11px;font-weight:900}.field input,.field select,.field textarea,.search{background:#0d0f13;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--orange)}.btn{border:1px solid var(--line);background:#181b21;color:#fff;border-radius:10px;padding:10px 12px;font-size:11px;font-weight:900;cursor:pointer}.btn.primary{background:var(--orange);border-color:var(--orange)}.btn.green{color:#8ef1bc}.btn.red{color:#ff9da4}.btn.blue{color:#a9caff}.btn.full{width:100%;margin-top:16px}.shell{display:none}.topbar{position:sticky;top:0;z-index:30;background:rgba(10,11,14,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topin{max-width:1540px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px}.topin .brand{font-size:19px}.live{font-size:10px;color:#9cefc2;font-weight:900}.top-actions{margin-left:auto;display:flex;gap:7px}.layout{max-width:1540px;margin:auto;padding:24px 18px 60px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}.hero h1{font-size:36px;margin:4px 0;letter-spacing:-1.8px}.cards{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;margin:16px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;min-height:86px}.card span{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:900}.card strong{display:block;font-size:22px;margin-top:8px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab{border:1px solid var(--line);background:var(--panel);color:#b9c0c8;border-radius:10px;padding:9px 13px;font-size:11px;font-weight:900;white-space:nowrap}.tab.active{background:var(--orange);border-color:var(--orange);color:#fff}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.panel-head{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{margin:0;font-size:14px}.tools{display:flex;gap:7px;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1100px}.table th,.table td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;text-align:left}.table th{position:sticky;top:0;background:#121419;color:#838d98;font-size:9px;text-transform:uppercase;letter-spacing:.6px}.table tr:hover td{background:#15181e}.code{font-weight:950;color:#fff}.status{display:inline-block;border:1px solid #39404a;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:900}.status.SOLICITADO{color:#ffb17b}.status.RECEBIDO,.status.PAGAMENTO_RECEBIDO,.status.MATERIAL_RECEBIDO,.status.PUBLICADO,.status.FINALIZADO,.status.APROVADO{color:#8feab8}.status.REJEITADO,.status.CANCELADO,.status.REPROVADO{color:#ff9ba3}.empty{padding:28px;text-align:center;color:var(--muted)}.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.64);display:none;z-index:80}.drawer{position:fixed;top:0;right:0;width:min(760px,100%);height:100%;background:#0d0f13;border-left:1px solid var(--line);z-index:90;display:none;overflow:auto}.drawer-head{position:sticky;top:0;background:#0d0f13;border-bottom:1px solid var(--line);padding:15px 17px;display:flex;align-items:center;gap:12px}.drawer-head button{margin-left:auto}.drawer-body{padding:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.box{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}.box h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#9da5af;margin:0 0 10px}.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:11px}.kv .k{color:#7f8994}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.history{display:grid;gap:8px}.history div{border-left:2px solid #39404a;padding-left:10px}.history b{font-size:11px}.history small{display:block;color:var(--muted);margin-top:3px}.material{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}.material:last-child{border-bottom:0}.material small{display:block;color:var(--muted);margin-top:3px}.catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px}.catalog-card{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px}.catalog-card h3{margin:0 0 6px;font-size:13px}.catalog-card p{margin:0;color:var(--muted);font-size:11px}.error{color:#ff9ba3;font-size:11px;margin-top:10px}.toast{position:fixed;bottom:20px;right:20px;background:#171b20;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:11px;z-index:120;display:none}.toast.error{color:#ff9ba3}@media(max-width:1100px){.cards{grid-template-columns:repeat(5,1fr)}}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.catalog-grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.topin{flex-wrap:wrap}.top-actions{width:100%;margin-left:0}.search{width:100%}}
</style>
</head>
<body>
<section class="login" id="login"><div class="login-card"><div class="eyebrow">CENTRO OPERACIONAL</div><div class="brand">DOOX CORE V2<i></i></div><h1>Núcleo novo.</h1><p class="muted">Pedidos, pagamentos, materiais, episódios e programação no schema DOOX V2.</p><form id="loginForm"><div class="field"><label>SENHA ADMINISTRATIVA</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary full" type="submit">ENTRAR</button><div class="error" id="loginError"></div></form></div></section>
<div class="shell" id="shell"><header class="topbar"><div class="topin"><div class="brand">DOOX CORE V2<i></i></div><span class="live">● ONLINE</span><div class="top-actions"><button class="btn" id="refresh">ATUALIZAR</button><button class="btn red" id="logout">SAIR</button></div></div></header><main class="layout"><div class="hero"><div><div class="eyebrow">OPERAÇÃO HOCCO</div><h1>Controle total</h1><div class="muted">Um pedido, um UUID, um Código DOOX.</div></div><input class="search" id="search" placeholder="Código, cliente, empresa, WhatsApp ou e-mail"></div><div class="cards" id="cards"></div><div class="tabs" id="tabs"><button class="tab active" data-tab="pedidos">PEDIDOS</button><button class="tab" data-tab="pagamentos">PAGAMENTOS</button><button class="tab" data-tab="materiais">MATERIAIS</button><button class="tab" data-tab="episodios">EPISÓDIOS</button><button class="tab" data-tab="catalogo">CATÁLOGO</button></div><section class="panel"><div class="panel-head"><h2 id="panelTitle">Pedidos</h2><div class="tools"><select class="search" id="statusFilter" style="min-width:190px"><option value="">Todos os status</option></select><button class="btn primary hidden" id="newEpisode">NOVO EPISÓDIO</button></div></div><div id="content"></div></section></main></div>
<div class="drawer-bg" id="drawerBg"></div><aside class="drawer" id="drawer"><div class="drawer-head"><div><div class="eyebrow">PEDIDO</div><b id="drawerCode">—</b></div><button class="btn" id="closeDrawer">FECHAR</button></div><div class="drawer-body" id="drawerBody"></div></aside><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let DATA={pedidos:[],indicadores:{},episodios:[],modalidades:[]},TAB='pedidos',CURRENT=null,DETAIL=null;
const STATUS=['SOLICITADO','EM_ANALISE','AGUARDANDO_PAGAMENTO','PAGAMENTO_RECEBIDO','MATERIAL_PENDENTE','MATERIAL_RECEBIDO','EM_PRODUCAO','PROGRAMADO','PUBLICADO','FINALIZADO','REJEITADO','CANCELADO','ARQUIVADO'];
const NEXT={SOLICITADO:['EM_ANALISE','REJEITADO','CANCELADO'],EM_ANALISE:['AGUARDANDO_PAGAMENTO','REJEITADO','CANCELADO'],AGUARDANDO_PAGAMENTO:['PAGAMENTO_RECEBIDO','CANCELADO'],PAGAMENTO_RECEBIDO:['MATERIAL_PENDENTE','MATERIAL_RECEBIDO','CANCELADO'],MATERIAL_PENDENTE:['MATERIAL_RECEBIDO','CANCELADO'],MATERIAL_RECEBIDO:['EM_PRODUCAO','CANCELADO'],EM_PRODUCAO:['PROGRAMADO','CANCELADO'],PROGRAMADO:['PUBLICADO','CANCELADO'],PUBLICADO:['FINALIZADO'],FINALIZADO:['ARQUIVADO'],REJEITADO:['ARQUIVADO'],CANCELADO:['ARQUIVADO'],ARQUIVADO:[]};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function brl(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0)}function dt(v){if(!v)return'—';try{return new Date(v).toLocaleString('pt-BR')}catch{return String(v)}}function st(v){const x=String(v||'—');return `<span class="status ${esc(x)}">${esc(x.replaceAll('_',' '))}</span>`}function idOf(p){return p?.id||p?.pedido_id||''}
async function api(action,body={},method='POST'){const opt={method,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'}};if(method!=='GET')opt.body=JSON.stringify({action,...body});const r=await fetch(`/api/doox-v2-admin?action=${encodeURIComponent(action)}`,opt);let j={};try{j=await r.json()}catch{}if(!r.ok||j.ok===false)throw new Error(j.message||`Erro ${r.status}`);return j}
function toast(msg,error=false){const t=$('toast');t.textContent=msg;t.className='toast'+(error?' error':'');t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
function showLogin(){$('login').style.display='grid';$('shell').style.display='none'}function showShell(){$('login').style.display='none';$('shell').style.display='block'}
async function load(){try{DATA=await api('dashboard',{},'GET');render()}catch(e){toast(e.message,true);if(/Autorização/.test(e.message))showLogin()}}
function render(){renderCards();renderStatus();renderContent()}
function renderCards(){const x=DATA.indicadores||{};const items=[['Novos',x.novos],['Em análise',x.em_analise],['Aguard. pagamento',x.aguardando_pagamento],['Material pendente',x.material_pendente],['Em produção',x.em_producao],['Programados',x.programados],['Publicados',x.publicados],['Finalizados',x.finalizados],['Recebido',brl(x.valor_recebido)],['Solicitado',brl(x.valor_solicitado)]];$('cards').innerHTML=items.map(([a,b])=>`<div class="card"><span>${esc(a)}</span><strong>${esc(b??0)}</strong></div>`).join('')}
function renderStatus(){const cur=$('statusFilter').value;$('statusFilter').innerHTML='<option value="">Todos os status</option>'+STATUS.map(s=>`<option value="${s}">${s.replaceAll('_',' ')}</option>`).join('');$('statusFilter').value=cur}
function filtered(){const q=$('search').value.trim().toLowerCase(),sf=$('statusFilter').value;return(DATA.pedidos||[]).filter(p=>{if(sf&&p.status_operacional!==sf)return false;if(!q)return true;return[p.codigo_doox,p.nome,p.empresa,p.whatsapp,p.email,p.modalidade_nome].some(v=>String(v||'').toLowerCase().includes(q))})}
function renderContent(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===TAB));$('newEpisode').classList.toggle('hidden',TAB!=='episodios');$('statusFilter').classList.toggle('hidden',!['pedidos','pagamentos','materiais'].includes(TAB));if(TAB==='pedidos')renderOrders();else if(TAB==='pagamentos')renderPayments();else if(TAB==='materiais')renderMaterials();else if(TAB==='episodios')renderEpisodes();else renderCatalog()}
function table(rows,headers){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${headers.map(h=>`<td>${h[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function openBtn(p){return `<button class="btn" onclick="openOrder('${esc(idOf(p))}')">ABRIR</button>`}
function renderOrders(){const rows=filtered();$('panelTitle').textContent=`Pedidos · ${rows.length}`;$('content').innerHTML=rows.length?table(rows,[['Código',p=>`<span class="code">${esc(p.codigo_doox)}</span>`],['Cliente',p=>esc(p.empresa||p.nome)],['Modalidade',p=>esc(p.modalidade_nome)],['Faixa',p=>esc(p.faixa_nome||'—')],['Qtd.',p=>esc(p.quantidade)],['Total',p=>brl(p.valor_total)],['Status',p=>st(p.status_operacional)],['Pagamento',p=>st(p.status_pagamento)],['Material',p=>st(p.status_material)],['Criado',p=>esc(dt(p.criado_em))],['',p=>openBtn(p)]]):'<div class="empty">Nenhum pedido.</div>'}
function renderPayments(){const rows=filtered().filter(p=>p.status_pagamento!=='RECEBIDO'&&p.status_pagamento!=='ISENTO');$('panelTitle').textContent=`Pagamentos pendentes · ${rows.length}`;$('content').innerHTML=rows.length?table(rows,[['Código',p=>`<span class="code">${esc(p.codigo_doox)}</span>`],['Cliente',p=>esc(p.empresa||p.nome)],['Valor',p=>brl(p.valor_total)],['Pagamento',p=>st(p.status_pagamento)],['Status',p=>st(p.status_operacional)],['',p=>`<button class="btn green" onclick="confirmPay('${idOf(p)}',${Number(p.valor_total||0)})">CONFIRMAR</button> ${openBtn(p)}`]]):'<div class="empty">Nenhum pagamento pendente.</div>'}
function renderMaterials(){const rows=filtered().filter(p=>['PENDENTE','PARCIAL','RECEBIDO','REPROVADO'].includes(p.status_material));$('panelTitle').textContent=`Materiais · ${rows.length}`;$('content').innerHTML=rows.length?table(rows,[['Código',p=>`<span class="code">${esc(p.codigo_doox)}</span>`],['Cliente',p=>esc(p.empresa||p.nome)],['Modalidade',p=>esc(p.modalidade_nome)],['Material',p=>st(p.status_material)],['Status',p=>st(p.status_operacional)],['',p=>openBtn(p)]]):'<div class="empty">Nenhum material pendente.</div>'}
function renderEpisodes(){const rows=DATA.episodios||[];$('panelTitle').textContent=`Episódios · ${rows.length}`;$('content').innerHTML=rows.length?table(rows,[['Código',e=>`<span class="code">${esc(e.codigo)}</span>`],['Nº',e=>esc(e.numero??'—')],['Título',e=>esc(e.titulo||'—')],['Status',e=>st(e.status)],['Capacidade',e=>esc(e.capacidade_total??'—')],['Criado',e=>esc(dt(e.criado_em))]]):'<div class="empty">Nenhum episódio criado no V2.</div>'}
async function renderCatalog(){try{const c=await api('listarCatalogo',{},'GET');$('panelTitle').textContent='Catálogo V2';$('content').innerHTML='<div class="catalog-grid">'+c.modalidades.map(m=>`<div class="catalog-card"><h3>${esc(m.nome)}</h3><p>${esc(m.codigo)} · ${m.exige_faixa?'PREÇO POR FAIXA':brl(m.preco_base)}</p><div class="actions">${!m.exige_faixa?`<button class="btn" onclick="editModePrice('${esc(m.codigo)}',${Number(m.preco_base||0)})">ALTERAR PREÇO</button>`:''}</div>${c.faixas.filter(f=>f.modalidade_id===m.id).map(f=>`<div style="margin-top:9px;padding-top:9px;border-top:1px solid #2a2e36;font-size:11px">${esc(f.nome)} · <b>${brl(f.preco_unitario)}</b> <button class="btn" style="float:right;padding:5px 8px" onclick="editRangePrice('${f.id}',${Number(f.preco_unitario||0)})">EDITAR</button></div>`).join('')}</div>`).join('')+'</div>'}catch(e){$('content').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function openOrder(id){try{DETAIL=await api('pedidoDetalhe',{pedidoId:id});CURRENT=DETAIL.pedido;$('drawerCode').textContent=CURRENT.codigo_doox;$('drawerBg').style.display='block';$('drawer').style.display='block';renderDrawer()}catch(e){toast(e.message,true)}}
function renderDrawer(){const p=CURRENT,d=DETAIL;const next=NEXT[p.status_operacional]||[];$('drawerBody').innerHTML=`<div class="grid"><div class="box"><h3>Cliente</h3><div class="kv"><div class="k">Nome</div><div>${esc(p.nome)}</div><div class="k">Empresa</div><div>${esc(p.empresa||'—')}</div><div class="k">WhatsApp</div><div>${esc(p.whatsapp||'—')}</div><div class="k">E-mail</div><div>${esc(p.email||'—')}</div><div class="k">Tipo</div><div>${esc(p.tipo_participacao)}</div></div></div><div class="box"><h3>Pedido</h3><div class="kv"><div class="k">Modalidade</div><div>${esc(p.modalidade_nome)}</div><div class="k">Faixa</div><div>${esc(p.faixa_nome||'—')}</div><div class="k">Quantidade</div><div>${esc(p.quantidade)}</div><div class="k">Unitário</div><div>${brl(p.valor_unitario)}</div><div class="k">Total</div><div>${brl(p.valor_total)}</div></div></div><div class="box"><h3>Estados</h3><div class="kv"><div class="k">Operacional</div><div>${st(p.status_operacional)}</div><div class="k">Pagamento</div><div>${st(p.status_pagamento)}</div><div class="k">Material</div><div>${st(p.status_material)}</div><div class="k">Produção</div><div>${st(p.status_producao)}</div><div class="k">Veiculação</div><div>${st(p.status_veiculacao)}</div></div><div class="actions">${next.map(s=>`<button class="btn ${s==='REJEITADO'||s==='CANCELADO'?'red':''}" onclick="moveStatus('${s}')">${s.replaceAll('_',' ')}</button>`).join('')}</div></div><div class="box"><h3>Programação</h3><div class="kv"><div class="k">Episódio</div><div>${esc(p.episodio_codigo||'—')}</div><div class="k">Momento</div><div>${esc(p.momento_codigo||'—')}</div><div class="k">Posição</div><div>${esc(p.posicao_numero||'—')}</div><div class="k">Data</div><div>${esc(dt(p.programado_para))}</div></div><button class="btn blue full" onclick="programOrder()">PROGRAMAR / ALTERAR</button></div></div><div class="box" style="margin-top:10px"><h3>Pagamento</h3>${(d.pagamentos||[]).map(x=>`<div>${st(x.status)} · ${brl(x.valor)} · ${esc(dt(x.confirmado_em||x.criado_em))}</div>`).join('')||'<div class="muted">Sem registro.</div>'}<button class="btn green" style="margin-top:10px" onclick="confirmPay('${idOf(p)}',${Number(p.valor_total||0)})">CONFIRMAR PAGAMENTO</button></div><div class="box" style="margin-top:10px"><h3>Materiais</h3>${materials(d.materiais||[])}</div><div class="box" style="margin-top:10px"><h3>Histórico</h3><div class="history">${(d.historico||[]).map(h=>`<div><b>${esc(h.evento||h.campo)}</b><small>${esc(dt(h.criado_em))}${h.status_anterior||h.status_novo?` · ${esc(h.status_anterior||'')} → ${esc(h.status_novo||'')}`:''}${h.observacao?` · ${esc(h.observacao)}`:''}</small></div>`).join('')||'<div class="muted">Sem histórico.</div>'}</div></div>`}
function materials(arr){return arr.length?arr.map(m=>`<div class="material"><b>${esc(m.tipo)} · ${esc(m.nome_original)}</b><small>${esc(m.mime_type)} · ${Math.round(Number(m.tamanho_bytes||0)/1024)} KB · ${esc(m.status)}</small><div class="actions"><button class="btn" onclick="downloadFile('${esc(m.storage_path)}')">BAIXAR</button><button class="btn green" onclick="approveMat('${m.id}',true)">APROVAR</button><button class="btn red" onclick="approveMat('${m.id}',false)">REPROVAR</button></div></div>`).join(''):'<div class="muted">Nenhum material registrado.</div>'}
function closeDrawer(){$('drawer').style.display='none';$('drawerBg').style.display='none';CURRENT=DETAIL=null}
async function moveStatus(s){if(!CURRENT)return;const obs=prompt(`Observação para ${s.replaceAll('_',' ')} (opcional):`)||'';if(!confirm(`Alterar ${CURRENT.codigo_doox} para ${s.replaceAll('_',' ')}?`))return;try{await api('alterarStatus',{pedidoId:idOf(CURRENT),status:s,observacao:obs});toast('Status atualizado.');await load();await openOrder(idOf(CURRENT))}catch(e){toast(e.message,true)}}
async function confirmPay(id,total){const raw=prompt('Valor confirmado:',Number(total||0).toFixed(2));if(raw===null)return;const valor=Number(String(raw).replace(',','.'));if(!Number.isFinite(valor)){toast('Valor inválido.',true);return}try{await api('confirmarPagamento',{pedidoId:id,valor,metodo:'PIX'});toast('Pagamento confirmado.');await load();if(CURRENT)await openOrder(id)}catch(e){toast(e.message,true)}}
async function approveMat(id,ok){const motivo=ok?'Aprovado no DOOX Core V2.':(prompt('Motivo da reprovação:')||'Reprovado pela DOOX.');try{await api('aprovarMaterial',{materialId:id,aprovado:ok,motivo});toast(ok?'Material aprovado.':'Material reprovado.');await load();if(CURRENT)await openOrder(idOf(CURRENT))}catch(e){toast(e.message,true)}}
async function downloadFile(path){try{const r=await fetch(`/api/materials-v2?action=download_url&path=${encodeURIComponent(path)}`,{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.message||'Falha ao gerar download.');window.open(j.download_url,'_blank','noopener')}catch(e){toast(e.message,true)}}
async function programOrder(){if(!CURRENT)return;const eps=DATA.episodios||[];if(!eps.length){toast('Crie um episódio primeiro.',true);return}const list=eps.map(e=>`${e.id} | ${e.codigo} | ${e.titulo||''}`).join('\n');const eid=prompt('Cole o UUID do episódio:\n'+list,CURRENT.episodio_id||eps[0].id);if(!eid)return;const momento=prompt('Momento/faixa operacional:',CURRENT.momento_codigo||CURRENT.faixa_codigo||'')||'';const pos=prompt('Posição (opcional):',CURRENT.posicao_numero||'')||'';const when=prompt('Data/hora de programação (ISO, opcional):',CURRENT.programado_para||'')||'';try{await api('programarPedido',{pedidoId:idOf(CURRENT),episodioId:eid,momento_codigo:momento,posicao_numero:pos?Number(pos):null,programado_para:when||null});toast('Programação gravada.');await load();await openOrder(idOf(CURRENT))}catch(e){toast(e.message,true)}}
async function createEpisode(){const numero=prompt('Número do episódio:');if(numero===null)return;const titulo=prompt('Título do episódio (opcional):')||'';try{await api('criarEpisodio',{numero:Number(numero),titulo,status:'ABERTO'});toast('Episódio criado.');await load()}catch(e){toast(e.message,true)}}
async function editModePrice(c,p){const raw=prompt(`Novo preço para ${c}:`,Number(p).toFixed(2));if(raw===null)return;const v=Number(String(raw).replace(',','.'));try{await api('atualizarPrecoModalidade',{codigo:c,preco:v});toast('Preço atualizado.');renderCatalog()}catch(e){toast(e.message,true)}}
async function editRangePrice(id,p){const raw=prompt('Novo preço da faixa:',Number(p).toFixed(2));if(raw===null)return;const v=Number(String(raw).replace(',','.'));try{await api('atualizarPrecoFaixa',{faixaId:id,preco:v});toast('Preço atualizado.');renderCatalog()}catch(e){toast(e.message,true)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{const r=await fetch('/api/doox-v2-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:$('password').value})});const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.message||'Falha no login.');$('password').value='';showShell();await load()}catch(e){$('loginError').textContent=e.message}};$('logout').onclick=async()=>{await api('logout');showLogin()};$('refresh').onclick=load;$('search').oninput=renderContent;$('statusFilter').onchange=renderContent;$('newEpisode').onclick=createEpisode;$('drawerBg').onclick=closeDrawer;$('closeDrawer').onclick=closeDrawer;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;renderContent()});
(async()=>{try{const s=await api('session',{},'GET');if(s.authenticated){showShell();await load()}else showLogin()}catch{showLogin()}})();
</script>
</body></html>
